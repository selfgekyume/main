<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sorrowbloom</title>
<meta name="description" content="An emo dungeon crawl.">
<meta name="theme-color" content="#050208">
<!-- installable: home screen icon, no browser bars -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sorrowbloom">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Silkscreen&family=VT323&display=swap">
<style>
/* One look by design: it is always night. The game renders at 480x270 and is scaled up nearest-neighbour. */
:root{--bg:#050208;--ink:#e9e1f0;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#screen{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.crt{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.14) 3px);mix-blend-mode:multiply}
noscript{color:var(--ink);font:20px monospace;position:fixed;inset:0;display:grid;place-items:center}
/* phones held upright: the game is 16:9, so ask for landscape. Tap to play anyway. */
#rotate{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;background:var(--bg);color:var(--ink);text-align:center;touch-action:manipulation}
@media (orientation:portrait) and (pointer:coarse){#rotate:not(.dismissed){display:flex}}
#rotate .phone{width:34px;height:58px;border:3px solid #ff8fc8;border-radius:7px;animation:tilt 2.4s ease-in-out infinite}
#rotate p{margin:0;font:28px "Pirata One",serif}
#rotate small{font:16px VT323,monospace;color:#8f86a0}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){#rotate .phone{animation:none;transform:rotate(-90deg)}}
/* run code entry on the setup screen: a real text field so phones show their keyboard */
#seedbox{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 18px;background:#0b0714;border:1px solid #ff4f7b}
#seedbox[hidden]{display:none}
#seedbox label{font:17px VT323,monospace;color:#8f86a0}
#seedbox input{font:30px VT323,monospace;letter-spacing:.12em;text-transform:uppercase;text-align:center;width:9em;padding:6px 8px;background:#050208;color:var(--ink);border:1px solid #5a4068;border-radius:0;outline:none;-webkit-user-select:text;user-select:text}
#seedbox input:focus{border-color:#ff8fc8}
</style>
</head>
<body>
<canvas id="screen" tabindex="0" aria-label="Sorrowbloom, an emo dungeon crawl"></canvas>
<div class="crt"></div>
<div id="rotate" role="dialog" aria-label="Rotate your phone"><div class="phone"></div><p>Turn your phone sideways</p><small>or tap to keep going</small></div>
<form id="seedbox" hidden autocomplete="off"><label for="seedin">Run code · leave empty for random</label><input id="seedin" maxlength="9" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ABCD-EFGH" enterkeyhint="done"></form>
<noscript>Sorrowbloom needs JavaScript.</noscript>
<script>
'use strict';
/* =====================================================================
   SORROWBLOOM : an emo myspace dungeon crawl
   Sections: 1 config · 2 rng/util · 3 save · 4 view/input · 5 audio
   6 music · 7 sprites · 8 content · 9 world gen · 10 entities/combat
   11 bosses · 12 lighting/fx · 13 ui · 14 main loop
   ===================================================================== */

// ---------- 1. CONFIG ----------
const W=480,H=270,CELL=24,RC=17,RR=9,OX=36,OY=27,IW=RC*CELL,IH=RR*CELL;
const CX=OX+IW/2,CY=OY+IH/2,TAU=Math.PI*2;
const F_T='"Pirata One", serif',F_U='Silkscreen, monospace',F_X='VT323, monospace';
const T_FLOOR=0,T_ROCK=1,T_POT=2,T_PIT=3,T_SPIKE=4,T_BLOCK=5,T_FIRE=6;
const SOLID_W=[0,1,1,1,0,1,1];   // blocks walkers
const BLOCK_SHOT=[0,1,1,0,0,1,1]; // blocks tears and bullets
const TUNE={tearSpeed:3.4,range:165,moveSpeed:1.45,invuln:60,maxHalves:24,doorX:8,doorY:4};

// ---------- 2. RNG / UTIL ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const d2=(ax,ay,bx,by)=>{const x=bx-ax,y=by-ay;return x*x+y*y};
const angTo=(ax,ay,bx,by)=>Math.atan2(by-ay,bx-ax);
const mtof=m=>440*Math.pow(2,(m-69)/12);
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
class RNG{
  constructor(s){this.f=mulberry32(s>>>0)}
  next(){return this.f()}
  range(a,b){return a+this.f()*(b-a)}
  int(a,b){return a+Math.floor(this.f()*(b-a+1))}
  pick(a){return a[Math.floor(this.f()*a.length)]}
  chance(p){return this.f()<p}
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(this.f()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
}
const FX=new RNG(Date.now()); // cosmetic randomness only, never affects a seeded run
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const SEED_A='ABCDEFGHJKLMNPQRSTVWXYZ23456789';
function seedString(n){let s='';n=n>>>0;for(let i=0;i<8;i++){s+=SEED_A[n%SEED_A.length];n=Math.floor(n/SEED_A.length)+i*7}return s.slice(0,4)+'-'+s.slice(4)}
function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

// ---------- 3. SAVE ----------
const SAVE_KEY='sorrowbloom.v1';
const Save={
  d:null,
  fresh(){return{ach:{},seenI:{},gotI:{},seenE:{},bossK:{},
    stats:{runs:0,wins:0,deaths:0,kills:0,secrets:0,confess:0},
    opts:{lang:(navigator.language||'').toLowerCase().startsWith('es')?'es':'en',master:1,music:.75,sfx:.8,ambVol:.8,mono:false,shake:1,flash:true,hints:true,autofire:false,aim:false,dmgNums:false,fps:false,crt:true,grain:true,pixel:false,hiContrast:false,touchSize:1,diff:0,timer:false,touchStyle:'twin',touchAssist:true,aimLine:true,flick:true,lefty:false,binds:{}},daily:{},best:0,hard:false,lastChar:'wren',tutDone:false,mods:{},chars:{},weekly:{},bestSplits:{},texts:{},bank:0,merch:{owned:{},on:{}}}},
  load(){
    let s=null;try{s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){s=null}
    const f=this.fresh();
    if(s&&typeof s==='object')for(const k in f){
      if(s[k]===undefined)continue;
      f[k]=(f[k]&&typeof f[k]==='object')?Object.assign(f[k],s[k]):s[k];
    }
    this.d=f;
  },
  write(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(this.d))}catch(e){}}
};
const ACH=[
  {id:'moths',name:'Moth Dust',desc:'Defeat The Mother of Moths',unlock:['char:ash','item:mothwings']},
  {id:'floor3',name:'Getting Deeper',desc:'Reach The Overgrown Chapel',unlock:['item:sadsong']},
  {id:'floor4',name:'Static',desc:'Reach Static Hospital',unlock:['char:juniper']},
  {id:'choir',name:'Encore',desc:'Defeat The Choirmaster',unlock:['item:distortion']},
  {id:'flat',name:'Flatline',desc:'Defeat The Flatline',unlock:['item:staticcassette']},
  {id:'bride',name:'Something Borrowed',desc:'Defeat The Drowned Bride',unlock:['char:twins']},
  {id:'saint',name:'Burn Bright',desc:'Defeat The Ember Saint',unlock:['item:glassheart']},
  {id:'win',name:'The Last Room',desc:'Finish the game',unlock:['char:nobody','mode:hard','item:papercrown']},
  {id:'hug',name:'Stay',desc:'Choose not to fight yourself',unlock:['item:polaroid']},
  {id:'kills',name:'Scene Points',desc:'Kill 250 things in total',unlock:['item:bassdrop']},
  {id:'secret',name:'Behind The Wall',desc:'Find 3 secret rooms',unlock:['item:flashlight']},
  {id:'sad5',name:'Again',desc:'Die 5 times',unlock:['item:ouija']},
  {id:'confess',name:'Confession',desc:'Give up a heart in a confession booth',unlock:['item:ribcage']},
  {id:'flawless',name:'Untouched',desc:'Beat a boss without getting hurt',unlock:['item:top8']},
  {id:'transform',name:'Becoming',desc:'Transform during a run',unlock:['item:awaymsg']},
];
function isUnlocked(key){
  for(const a of ACH)if(a.unlock.includes(key))return !!Save.d.ach[a.id];
  return true;
}
function unlockHint(key){const a=ACH.find(a=>a.unlock.includes(key));return a?a.desc:''}
function grantAch(id){
  if(Save.d.ach[id])return;
  Save.d.ach[id]=Date.now();Save.write();
  const a=ACH.find(x=>x.id===id);
  if(a){AU.play('achieve');toast(tr('UNLOCKED')+': '+tr(a.name),a.desc,'#ffd23f');if(G.run)G.run.newUnlocks.push(a)}
}

// ---------- 4. VIEW / INPUT ----------
const buf=mkCanvas(W,H),B=buf.getContext('2d');
const View={
  cv:null,ctx:null,scale:1,ox:0,oy:0,dpr:1,
  init(){
    this.cv=document.getElementById('screen');this.ctx=this.cv.getContext('2d',{alpha:false});
    addEventListener('resize',()=>this.resize());this.resize();
  },
  resize(){
    const dpr=Math.min(devicePixelRatio||1,3),cw=Math.max(1,innerWidth*dpr|0),ch=Math.max(1,innerHeight*dpr|0);
    this.cv.width=cw;this.cv.height=ch;
    let s=Math.min(cw/W,ch/H);const fs=Math.floor(s);if(Save.d&&Save.d.opts.pixel&&fs>=1)s=fs;else if(fs>=2&&fs/s>0.86)s=fs;
    this.scale=s;this.ox=(cw-W*s)/2|0;this.oy=(ch-H*s)/2|0;this.dpr=dpr;
    this.ctx.imageSmoothingEnabled=false;
  },
  toGame(cx,cy){return{x:(cx*this.dpr-this.ox)/this.scale,y:(cy*this.dpr-this.oy)/this.scale}}
};

const KEYS={up:['KeyW'],down:['KeyS'],left:['KeyA'],right:['KeyD'],
  su:['ArrowUp'],sd:['ArrowDown'],sl:['ArrowLeft'],sr:['ArrowRight'],
  active:['Space'],bomb:['KeyQ'],dash:['ShiftLeft','ShiftRight'],use:['KeyE'],pause:['Escape','KeyP'],map:['Tab'],
  ok:['Enter','Space','KeyZ'],back:['Escape','Backspace','KeyX'],
  mu:['ArrowUp','KeyW'],md:['ArrowDown','KeyS'],ml:['ArrowLeft','KeyA'],mr:['ArrowRight','KeyD'],mute:['KeyM'],full:['KeyF']};
const PADB={ok:[0],back:[1],dash:[1,10],active:[5,7],bomb:[4,6],use:[2,3],pause:[9],map:[8],mu:[12],md:[13],ml:[14],mr:[15]};
// touch buttons (game coordinates)
const TBTN=[{id:'active',x:W-26,y:86,r:14,label:'ITEM'},{id:'bomb',x:W-60,y:110,r:12,label:'CNDL'},{id:'use',x:W-26,y:178,r:11,label:'USE'},{id:'dash',x:W-60,y:150,r:12,label:'DASH'},{id:'pause',x:W-96,y:14,r:10,label:'II'}];
// left-handed mode mirrors the action buttons; pause stays put
function tbtns(){return Save.d.opts.lefty?TBTN.map(b=>b.id==='pause'?b:Object.assign({},b,{x:W-b.x})):TBTN}
const STICK_R=22;
const Input={
  down:new Set(),hit:new Set(),pb:{},pbHit:new Set(),tHit:new Set(),
  ptr:{x:W/2,y:H/2,down:false,mouse:false},clicks:[],
  touches:new Map(),touchUI:false,mapHeld:false,
  move:{x:0,y:0},aim:{x:0,y:0},fire:false,stickPrev:{x:0,y:0},dev:'kb',
  init(cv){
    addEventListener('keydown',e=>{
      if(e.target&&e.target.tagName==='INPUT')return; // typing a run code
      if(['Tab','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
      if(G.rebind){e.preventDefault();if(e.code!=='Escape'){Save.d.opts.binds[G.rebind]=e.code;applyBinds();Save.write()}G.rebind=null;return}
      this.dev='kb';
      if(!this.down.has(e.code))this.hit.add(e.code);
      this.down.add(e.code);this.touchUI=false;onUserGesture();
    });
    addEventListener('keyup',e=>this.down.delete(e.code));
    addEventListener('blur',()=>{this.down.clear();this.ptr.down=false;this.touches.clear();onBlur()});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)onBlur()});
    cv.addEventListener('contextmenu',e=>e.preventDefault());
    cv.addEventListener('pointerdown',e=>{
      e.preventDefault();
      // tapping away from the run code box closes it; that tap does nothing else
      if(seedOpen()){closeSeed(true);this.swallow=e.pointerId;return}
      onUserGesture();
      try{cv.setPointerCapture(e.pointerId)}catch(_){}
      const p=View.toGame(e.clientX,e.clientY);
      if(e.pointerType==='touch'){
        this.touchUI=true;this.dev='touch';
        if(G.state==='play'){
          if(inRect(p,[404,4,70,32])){G.mapToggle=!G.mapToggle;this.touches.set(e.pointerId,{role:'btn'});return}
          const o=Save.d.opts,ts=o.touchSize;const b=tbtns().find(b=>d2(p.x,p.y,b.x,b.y)<(b.r*ts+6)*(b.r*ts+6));
          if(b){this.tHit.add(b.id);this.touches.set(e.pointerId,{role:'btn'});return}
          // point & shoot gives the aiming side more room
          const split=o.touchStyle==='point'?.4:.5,moveSide=o.lefty?p.x>=W*(1-split):p.x<W*split;
          this.touches.set(e.pointerId,{role:moveSide?'move':'aim',ox:p.x,oy:p.y,x:p.x,y:p.y,hist:[{x:p.x,y:p.y,t:e.timeStamp}],flickT:-1e9});
        }else this.clicks.push(p);
      }else{
        this.ptr.x=p.x;this.ptr.y=p.y;this.ptr.mouse=true;this.dev='kb';this.touchUI=false;
        if(e.button===0){this.ptr.down=true;this.clicks.push(p)}
        if(e.button===2&&G.state==='play')this.tHit.add('active');
      }
    });
    cv.addEventListener('pointermove',e=>{
      const p=View.toGame(e.clientX,e.clientY);
      const t=this.touches.get(e.pointerId);
      if(t){t.x=p.x;t.y=p.y;
        // move stick stays where your thumb first landed; the aim stick's base trails your thumb so turning is quick
        if(t.role==='aim'){const dx=t.x-t.ox,dy=t.y-t.oy,d=Math.hypot(dx,dy);if(d>STICK_R){t.ox=t.x-dx/d*STICK_R;t.oy=t.y-dy/d*STICK_R}}
        if(t.role==='move'&&Save.d.opts.flick)this.checkFlick(t,e.timeStamp);
      }
      if(e.pointerType!=='touch'){this.ptr.x=p.x;this.ptr.y=p.y;this.ptr.mouse=true}
    });
    // a finger lifting is what browsers count as a real tap, so audio unlock and fullscreen go here
    const up=e=>{this.touches.delete(e.pointerId);if(e.pointerType==='touch'){AU.init();autoFull()}else if(e.button===0)this.ptr.down=false;
      if(this.swallow===e.pointerId){this.swallow=null;return}
      // the run code box has to open inside the tap itself or phones won't show the keyboard
      if((G.state==='setup'||G.state==='summary')&&e.type==='pointerup')setupTapUp(View.toGame(e.clientX,e.clientY))};
    cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  },
  // a fast swipe of the move thumb dashes that way
  checkFlick(t,now){
    const h=t.hist;h.push({x:t.x,y:t.y,t:now});while(h.length>2&&now-h[0].t>90)h.shift();
    const a=h[0],dx=t.x-a.x,dy=t.y-a.y,d=Math.hypot(dx,dy);
    if(d>28&&now-a.t<=90&&now-t.flickT>350&&G.state==='play'){t.flickT=now;t.hist=[{x:t.x,y:t.y,t:now}];this.tHit.add('dash');this.flick={x:dx/d,y:dy/d}}
  },
  k(n){return KEYS[n].some(c=>this.down.has(c))},
  pressed(n){return(KEYS[n]&&KEYS[n].some(c=>this.hit.has(c)))||this.pbHit.has(n)||this.tHit.has(n)},
  update(){
    let mx=(this.k('right')?1:0)-(this.k('left')?1:0),my=(this.k('down')?1:0)-(this.k('up')?1:0);
    let ax=(this.k('sr')?1:0)-(this.k('sl')?1:0),ay=(this.k('sd')?1:0)-(this.k('su')?1:0);
    this.mapHeld=this.k('map');
    let gp=null;
    try{const pads=navigator.getGamepads?navigator.getGamepads():[];for(const p of pads)if(p&&p.connected){gp=p;break}}catch(e){}
    if(gp){
      for(const name in PADB){
        const on=PADB[name].some(i=>gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>.5));
        if(on&&!this.pb[name])this.pbHit.add(name);
        this.pb[name]=on;
      }
      if(this.pb.map)this.mapHeld=true;
      if(gp.buttons.some(b=>b&&b.pressed)||gp.axes.some(v=>Math.abs(v)>.5)){this.dev='pad';this.touchUI=false}
      const lx=gp.axes[0]||0,ly=gp.axes[1]||0,rx=gp.axes[2]||0,ry=gp.axes[3]||0;
      if(Math.hypot(lx,ly)>.22){mx=lx;my=ly}
      if(Math.hypot(rx,ry)>.35){ax=rx;ay=ry}
      if(ly<-.6&&this.stickPrev.y>=-.6)this.pbHit.add('mu');
      if(ly>.6&&this.stickPrev.y<=.6)this.pbHit.add('md');
      if(lx<-.6&&this.stickPrev.x>=-.6)this.pbHit.add('ml');
      if(lx>.6&&this.stickPrev.x<=.6)this.pbHit.add('mr');
      this.stickPrev={x:lx,y:ly};
    }
    const style=Save.d.opts.touchStyle;
    for(const t of this.touches.values()){
      if(t.role==='move'){const dx=(t.x-t.ox)/20,dy=(t.y-t.oy)/20;mx=dx;my=dy}
      if(t.role!=='aim')continue;
      if(style==='point'){if(G.player){const dx=t.x-G.player.x,dy=t.y-G.player.y+3;if(dx*dx+dy*dy>64){ax=dx;ay=dy}}}
      else{const dx=t.x-t.ox,dy=t.y-t.oy;if(dx*dx+dy*dy>25){ax=dx;ay=dy;
        if(style==='eight'){const a=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*Math.PI/4;ax=Math.cos(a);ay=Math.sin(a)}}}
    }
    if(this.ptr.down&&this.ptr.mouse&&G.state==='play'&&G.player){ax=this.ptr.x-G.player.x;ay=this.ptr.y-G.player.y}
    const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
    const al=Math.hypot(ax,ay);if(al>0.01){ax/=al;ay/=al}else{ax=0;ay=0}
    this.move.x=mx;this.move.y=my;this.aim.x=ax;this.aim.y=ay;this.fire=al>0.01;
  },
  endStep(){this.hit.clear();this.pbHit.clear();this.tHit.clear();this.clicks.length=0;this.flick=null}
};

// ---------- 5. AUDIO ENGINE ----------
// Everything is synthesized. Guitars are double-tracked (hard L/R), driven into a waveshaper and a cab-ish EQ.
// Drop tuning goes lower every floor: drop C on floor I, down to F#1 in the last room.
// ----- recorded instruments: Karoryfer Lecolds' Emilyguitar, Growlybass and Big Rusty Drums (all CC0, see audio/README.md) -----
// each audio/*.mp3 is a sprite: a timing click at .05s, then the samples back to back. SMP_T gives [start, length] in seconds:
// gtr f<midi> = a guitar note picked hard (for the amp), c<midi> = played softer (for clean parts), bass b<midi>, drums by name.
// Each key has two takes, so the left and right guitars are different recordings, like a real double-tracked band.
const AUDIO_V={gtr:1,bass:1,drums:2}; // bump a file's number here and in sw.js whenever it changes

const iconCache={};
function iconCanvas(icon,c1,c2){
  const key=icon+c1+c2;if(iconCache[key])return iconCache[key];
  const t=mkCanvas(16,16),tx=t.getContext('2d');
  (ICON[icon]||ICON.heart)(tx,c1,c2);
  const c=mkCanvas(18,18),x=c.getContext('2d');
  x.globalCompositeOperation='source-over';
  for(const[dx,dy]of[[0,1],[2,1],[1,0],[1,2]])x.drawImage(t,dx,dy);
  x.globalCompositeOperation='source-in';x.fillStyle='#050208';x.fillRect(0,0,18,18);
  x.globalCompositeOperation='source-over';x.drawImage(t,1,1);
  return iconCache[key]=c;
}
const itemIcon=it=>iconCanvas(it.icon,it.c1,it.c2);

const DIRS={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},OPP={u:'d',d:'u',l:'r',r:'l'};
function genFloor(rng,depth){
  const GW=9,GH=8,S=4+3*GW;
  const nb=i=>{const x=i%GW,y=(i/GW)|0,o=[];if(y>0)o.push(['u',i-GW]);if(y<GH-1)o.push(['d',i+GW]);if(x>0)o.push(['l',i-1]);if(x<GW-1)o.push(['r',i+1]);return o};
  for(let attempt=0;attempt<400;attempt++){
    const occ=new Uint8Array(GW*GH),list=[S],q=[S];occ[S]=1;
    const target=depth===7?6:Math.min(18,6+Math.round(depth*1.6)+rng.int(0,2));
    const cnt=i=>nb(i).reduce((a,[,j])=>a+occ[j],0);
    while(q.length&&list.length<target){
      const c=q.shift();
      for(const[,n]of rng.shuffle(nb(c))){
        if(list.length>=target)break;
        if(occ[n]||cnt(n)>1)continue;
        if((c!==S||depth===7)&&rng.chance(.5))continue;
        occ[n]=1;list.push(n);q.push(n);
      }
      if(!q.length&&list.length<target)q.push(rng.pick(list));
    }
    if(list.length<target)continue;
    const ends=list.filter(i=>i!==S&&cnt(i)===1);
    if(ends.length<(depth===7?1:3))continue;
    const dist=new Int16Array(GW*GH).fill(-1);dist[S]=0;const bq=[S];
    while(bq.length){const c=bq.shift();for(const[,n]of nb(c))if(occ[n]&&dist[n]<0){dist[n]=dist[c]+1;bq.push(n)}}
    ends.sort((a,b)=>dist[b]-dist[a]);
    if(dist[ends[0]]<(depth===7?3:2))continue;
    const rooms=new Map();
    for(const i of list)rooms.set(i,{idx:i,gx:i%GW,gy:(i/GW)|0,type:'normal',doors:{},visited:false,seen:false,cleared:false,built:false,dist:dist[i]});
    rooms.get(S).type='start';rooms.get(ends[0]).type='boss';
    const rest=rng.shuffle(ends.slice(1));
    if(depth<7){
      if(rest.length)rooms.get(rest.shift()).type='treasure';
      if(rest.length)rooms.get(rest.shift()).type='shop';
      for(const i of rest){const r=rooms.get(i);if(depth>=2&&rng.chance(.45))r.type='confess';else if(rng.chance(.35))r.type='music'}
    }
    for(const r of rooms.values())for(const[d,n]of nb(r.idx))if(occ[n]&&!r.doors[d]){const o=rooms.get(n),link={secret:false,revealed:true};r.doors[d]={to:o,link};o.doors[OPP[d]]={to:r,link}}
    // secret room: an empty cell touching several rooms, never the boss
    if(depth<7){
      let best=null,bc=1;
      for(let i=0;i<GW*GH;i++){
        if(occ[i])continue;const ns=nb(i).filter(([,j])=>occ[j]);
        if(ns.some(([,j])=>rooms.get(j).type==='boss'))continue;
        const c=ns.length+rng.next()*.5;if(ns.length>=2&&c>bc){bc=c;best=i}
      }
      if(best!=null){
        const sr={idx:best,gx:best%GW,gy:(best/GW)|0,type:'secret',doors:{},visited:false,seen:false,cleared:false,built:false,dist:99};
        rooms.set(best,sr);
        for(const[d,n]of nb(best))if(occ[n]){const o=rooms.get(n),link={secret:true,revealed:false};sr.doors[d]={to:o,link};o.doors[OPP[d]]={to:sr,link}}
      }
    }
    return{depth,rooms,start:rooms.get(S),GW,GH};
  }
  throw new Error('floor gen failed');
}
function tileIdx(cx,cy){return cy*RC+cx}
function cellOf(x,y){return[Math.floor((x-OX)/CELL),Math.floor((y-OY)/CELL)]}
function tileAtCell(cx,cy){if(cx<0||cy<0||cx>=RC||cy>=RR)return -1;return G.room.tiles[cy*RC+cx]}
function cellCenter(cx,cy){return{x:OX+cx*CELL+CELL/2,y:OY+cy*CELL+CELL/2}}
function applyLayout(room,rng,depth){
  const t=room.tiles;let lay;
  if(rng.chance(.35)){lay=symLayout(rng,depth)}
  else{
    const s=rng.pick(LAYOUTS).split('\n').map(r=>r.trim());
    const fx=rng.chance(.5),fy=rng.chance(.5);
    lay=[];for(let y=0;y<RR;y++){let row='';for(let x=0;x<RC;x++){const sy=fy?RR-1-y:y,sx=fx?RC-1-x:x;row+=(s[sy]||'')[sx]||'.'}lay.push(row)}
  }
  for(let y=0;y<RR;y++)for(let x=0;x<RC;x++){
    let c=lay[y][x],v=T_FLOOR;
    if(c==='?')c=rng.chance(.6)?'#':(rng.chance(.5)?'o':'.');
    if(c==='#')v=T_ROCK;else if(c==='o')v=T_POT;else if(c==='~')v=T_PIT;else if(c==='^')v=T_SPIKE;else if(c==='X')v=T_BLOCK;else if(c==='f')v=T_FIRE;
    if(v===T_ROCK&&depth===6&&rng.chance(.25))v=T_FIRE;
    if(v===T_ROCK&&depth===5&&rng.chance(.2))v=T_PIT;
    if(v===T_FIRE&&depth<3)v=T_POT;
    t[tileIdx(x,y)]=v;
  }
  // keep door lanes clear
  for(const[x,y]of[[8,0],[8,RR-1],[0,4],[RC-1,4],[8,1],[8,RR-2],[1,4],[RC-2,4]])t[tileIdx(x,y)]=T_FLOOR;
  if(!connected(room)){for(let x=0;x<RC;x++)if(SOLID_W[t[tileIdx(x,4)]])t[tileIdx(x,4)]=T_FLOOR;for(let y=0;y<RR;y++)if(SOLID_W[t[tileIdx(8,y)]])t[tileIdx(8,y)]=T_FLOOR}
}
function symLayout(rng,depth){
  const g=Array.from({length:RR},()=>Array(RC).fill('.'));
  const kinds=depth===5?['~','~','#','o']:depth===6?['#','f','#','o']:depth===4?['#','^','X','o']:depth===3?['#','o','f','#']:['#','#','o','X'];
  const n=rng.int(2,5);
  for(let i=0;i<n;i++){
    const k=rng.pick(kinds),w=rng.int(1,3),h=rng.int(1,2),x0=rng.int(1,6),y0=rng.int(1,3);
    for(let y=y0;y<Math.min(4,y0+h);y++)for(let x=x0;x<Math.min(8,x0+w);x++){g[y][x]=k;g[y][RC-1-x]=k;g[RR-1-y][x]=k;g[RR-1-y][RC-1-x]=k}
  }
  return g.map(r=>r.join(''));
}
function walkable(t){return!SOLID_W[t]}
function connected(room){
  const t=room.tiles,seen=new Uint8Array(RC*RR),q=[tileIdx(8,4)];
  if(!walkable(t[q[0]]))return false;
  seen[q[0]]=1;let n=0;
  while(q.length){const i=q.pop();n++;const x=i%RC,y=(i/RC)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=RC||ny>=RR)continue;const j=tileIdx(nx,ny);if(!seen[j]&&walkable(t[j])){seen[j]=1;q.push(j)}}}
  for(const[x,y]of[[8,0],[8,RR-1],[0,4],[RC-1,4]])if(!seen[tileIdx(x,y)])return false;
  room.reach=seen;return true;
}
function buildRoom(room){
  const run=G.run,depth=run.depth,fl=G.floorDef;
  const rng=new RNG(roomSeed(room));
  room.tiles=new Uint8Array(RC*RR);room.tileHp={};room.pickups=[];room.peds=[];room.objects=[];room.spec=[];room.lights=[];
  if(room.type.startsWith('tut'))buildTutRoom(room);
  else if(room.type==='normal'){
    applyLayout(room,rng,depth);
    if(rng.chance(.08)){for(let i=0;i<rng.int(2,4);i++)room.pickups.push(mkPickup(rollDrop(rng,true),CX+rng.range(-80,80),CY+rng.range(-40,40)))}
    else{
      const n=clamp(2+Math.floor(depth*.6)+rng.int(0,2)+(run.hard?1:0)+diff().n+Math.min(2,run.loop||0),2,8);
      for(let i=0;i<n;i++){
        const type=rng.pick(fl.pool);
        room.spec.push({type,elite:rng.chance(.065+depth*.005)});
        if(type==='choir')i+=2;
      }
      if(rng.chance(.07))room.spec.push({type:'gremlin'});
      room.outage=rng.chance(.1);
    }
    if(rng.chance(.08)){const k=rng.chance(.5)?'jukebox':'photobooth',cx=rng.pick([1,15]),cy=rng.pick([1,7]);room.tiles[tileIdx(cx,cy)]=T_FLOOR;const c=cellCenter(cx,cy);room.objects.push({kind:k,x:c.x,y:c.y})}
  }else if(room.type==='treasure'){
    if(rng.chance(.5))for(const[x,y]of[[2,2],[14,2],[2,6],[14,6]])room.tiles[tileIdx(x,y)]=T_ROCK;
    const it=drawItem('t');if(it)room.peds.push({x:CX,y:CY,item:it});
  }else if(room.type==='shop'){
    const it=drawItem(room.sold?'t':'s');const disc=(G.player.flags.discount?.75:1)*(G.run.mods.sellout?.6:1);
    if(it)room.peds.push({x:CX-60,y:CY+10,item:it,price:Math.round(15*disc),pt:'pins'});
    const kinds=['heart','candle',rng.pick(['candy','card','black'])];
    kinds.forEach((k,i)=>room.pickups.push(mkPickup(k,CX+i*40-10,CY+10,{price:Math.round({heart:3,candle:5,candy:4,card:4,black:6}[k]*disc),fixed:true})));
    room.objects.push({kind:'keeper',x:CX,y:OY+26},{kind:'jukebox',x:OX+30,y:OY+30});
  }else if(room.type==='confess'){
    for(let i=0;i<2;i++){const it=drawItem('c');if(it)room.peds.push({x:CX+(i?50:-50),y:CY,item:it,price:it.q>=3?2:1,pt:'hearts'})}
    room.objects.push({kind:'booth',x:CX,y:OY+26});
  }else if(room.type==='rushstart'){
    // first round: an item to start with. Later rounds: the boss already dropped one, so a heart and some pins
    if(!G.run.round){const it=drawItem('t');if(it)room.peds.push({x:CX,y:CY-12,item:it})}
    else{room.pickups.push(mkPickup('heart',CX-30,CY+16));for(let i=0;i<3;i++)room.pickups.push(mkPickup('pin',CX+20+i*12,CY+16))}
  }else if(room.type==='music'){
    room.objects.push({kind:'musicbox',x:CX,y:CY,used:false});
  }else if(room.type==='secret'){
    if(rng.chance(.35)){const it=drawItem('t');if(it)room.peds.push({x:CX,y:CY,item:it})}
    else for(let i=0;i<rng.int(3,5);i++)room.pickups.push(mkPickup(rollDrop(rng,true),CX+rng.range(-60,60),CY+rng.range(-30,30)));
  }else if(room.type==='boss'){
    if(depth!==7&&rng.chance(.5))for(const[x,y]of[[3,2],[13,2],[3,6],[13,6]])room.tiles[tileIdx(x,y)]=T_ROCK;
  }
  connected(room);
  room.bg=buildBG(room,fl,rng);
  room.built=true;
}
function drawItem(k){
  const run=G.run;const order=[k,'t','b','s','c'];
  for(const key of order){const arr=run.pools[key];while(arr.length){const id=arr.pop();if(!run.taken[id]){run.taken[id]=1;Save.d.seenI[id]=1;return ITEM[id]}}}
  return null;
}
function rollDrop(rng,generous){
  const r=rng.next()-(G.player?G.player.luck*.01:0);
  if(r<.24)return'heart';if(r<.55)return rng.chance(.12)?'pin5':'pin';if(r<.68)return'candle';
  if(r<.74)return'black';if(r<.77)return'cracked';if(r<.84)return'candy';if(r<.9)return'card';
  return generous?'pin':null;
}

function updateTears(){

function tearHit(t,e){

function hurtEnemy(e,dmg,t){

function killEnemy(e){

// ----- enemy bullets -----
// difficulty (Settings > General). Lower settings mean less enemy health, slower bullets, and on Very Easy one fewer enemy per room.
// difficulty, picked on the run setup screen. Heavier's effects live in the run.hard checks; the others scale here.
const DIFFS={
  0:{l:'NORMAL',hp:1,bul:1,n:0,score:1,f:'The night as it was meant to be.'},
  1:{l:'EASY',hp:.7,bul:.88,n:0,score:.75,f:'Enemies have 70% health. Their bullets are a little slower.'},
  2:{l:'VERY EASY',hp:.5,bul:.78,n:-1,score:.5,f:'Enemies have half health and slower bullets. One fewer per room.'},
  4:{l:'HARD',hp:1.3,bul:1.1,n:0,score:1.25,f:'Enemies have 30% more health and faster bullets.'},
  3:{l:'HEAVIER',hp:1.15,bul:1.05,n:0,score:1.6,f:'Harder than Hard: an extra enemy per room, tougher bosses, darker rooms.'},
  5:{l:'SLEEPLESS',hp:1.35,bul:1.15,n:1,score:2.25,f:'Heavier, then worse: two extra enemies per room, and every hit takes a whole heart.'}};
// Heavier and Sleepless also switch on run.hard (extra enemy, boss health, darkness)
const diffOk=d=>!!DIFFS[d]&&(d!==3||isUnlocked('mode:hard'))&&(d!==5||isUnlocked('mode:sleepless'));
const diffOrder=()=>[2,1,0,4,3,5].filter(diffOk);
function diffLockHint(d){
  if(d===4&&!diffOk(3))return tr('Finish the game to unlock Heavier.');
  if(d===3&&!diffOk(5))return tr('Beat a boss on Heavier to unlock Sleepless.');
  return'';
}
const diff=()=>DIFFS[G.run?G.run.diff:(Save.d.opts.diff|0)]||DIFFS[0];
// run modifiers: each one is a real trade, and moves the score multiplier
const MODS=[
  {id:'hopeful',n:'Hopeful',f:'Two extra hearts. Every hit takes a whole heart.',score:1},
  {id:'reckless',n:'Reckless',f:'Double damage. You start with a single heart.',score:1.35},
  {id:'insomniac',n:'Insomniac',f:'The lights never come on. Everything drops twice as much.',score:1.15},
  {id:'sellout',n:'Sellout',f:'Treasure rooms become shops. Start with 20 pins, and everything costs 40% less.',score:1.05},
  {id:'handmedowns',n:'Hand-me-downs',f:'Start with two random items, and one less heart.',score:.9}];
const TOUCH_STYLES=[
  {id:'twin',l:'TWIN STICK',f:'Drag your aiming thumb in any direction to cry that way.'},
  {id:'eight',l:'8-WAY',f:'Like twin stick, but your aim snaps to 8 directions.'},
  {id:'point',l:'POINT & SHOOT',f:'Touch where you want your tears to go. Hold to keep crying.'}];
const curStyle=()=>TOUCH_STYLES.find(x=>x.id===Save.d.opts.touchStyle)||TOUCH_STYLES[0];

function runMult(d,mods){let m=(DIFFS[d]||DIFFS[0]).score;for(const x of MODS)if(mods&&mods[x.id])m*=x.score;return m}
function runTags(r){const t=[];if(r.diff)t.push(tr(DIFFS[r.diff].l));for(const x of MODS)if(r.mods&&r.mods[x.id])t.push(tr(x.n));return t.join(' · ')}
function fitText(c,s,maxW,size,font){s=tr(s);c.font=(size||8)+'px '+(font||F_U);if(c.measureText(s).width<=maxW)return s;while(s.length>1&&c.measureText(s+'...').width>maxW)s=s.slice(0,-1);return s+'...'}

function aimAt(x,y){const p=G.player;let a=angTo(x,y,p.x,p.y);if(p.flags.hidden||p.invisible)a+=FX.range(-.3,.3);return a}
function ebul(x,y,a,spd,o){
  o=o||{};spd*=bulletMul();
  G.ebul.push({orb:o.orb||null,x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,spd,r:o.r||3,life:o.life||420,col:o.col||'#ff3b5c',delay:o.delay||0,aimLater:!!o.aimLater,acc:o.acc||0,curve:o.curve||0,wave:o.wave||0,age:0,spec:!!o.spec});

const P={
  ring(x,y,n,spd,off,o){for(let i=0;i<n;i++)ebul(x,y,(off||0)+i/n*TAU,spd,o)},
  aimed(x,y,n,spread,spd,o){const a=aimAt(x,y);for(let i=0;i<n;i++)ebul(x,y,a+(i-(n-1)/2)*spread,spd,o)},
  spiral(e,arms,spd,step,o){e.sa=(e.sa||0)+step;for(let i=0;i<arms;i++)ebul(e.x,e.y,e.sa+i/arms*TAU,spd,o)},
  veil(n,gapW,spd,o){const gap=FX.int(0,n-gapW);for(let i=0;i<n;i++){if(i>=gap&&i<gap+gapW)continue;ebul(OX+8+i*(IW-16)/(n-1),OY+4,Math.PI/2,spd,Object.assign({wave:.5,spec:true},o))}},
};
function thr(e,k,f){const key='_'+k;if((e[key]||0)>G.t)return false;e[key]=G.t+f;return true}
function updateEBul(){
  const p=G.player,slow=G.slowT>0;
  for(let i=G.ebul.length-1;i>=0;i--){
    const b=G.ebul[i];let kill=false;
    if(!(slow&&(G.t&1))){
      b.age++;
      if(b.orb){const o=b.orb;if(o.t>0&&!o.e.dead){o.t--;o.a+=.05;b.x=o.e.x+Math.cos(o.a)*o.r;b.y=o.e.y+Math.sin(o.a)*o.r;if(o.t===0){b.vx=Math.cos(o.a)*1.8*bulletMul();b.vy=Math.sin(o.a)*1.8*bulletMul();b.orb=null}}else b.orb=null}
      else if(b.delay>0){b.delay--;if(b.delay===0&&b.aimLater){const a=aimAt(b.x,b.y);b.vx=Math.cos(a)*b.spd;b.vy=Math.sin(a)*b.spd}}
      else{

        b.x+=b.vx+(b.wave?Math.sin(b.age*.06)*b.wave:0);b.y+=b.vy;
      }
      if(--b.life<=0)kill=true;
      if(b.x<OX-4||b.x>OX+IW+4||b.y<OY-4||b.y>OY+IH+4)kill=true;
      else if(!b.spec){const[cx,cy]=cellOf(b.x,b.y),tt=tileAtCell(cx,cy);if(tt>0&&BLOCK_SHOT[tt])kill=true}
    }
    if(!kill&&!p.dead){
      const rr=b.r+p.r-1.5;
      if(d2(b.x,b.y,p.x,p.y)<rr*rr){damagePlayer(dmgUnit(),G.boss?G.boss.def.name:'a stray note');kill=true}
      else if(p.twin&&d2(b.x,b.y,p.twin.x,p.twin.y)<rr*rr){damagePlayer(dmgUnit(),'a stray note');kill=true}
      else for(const f of p.fams)if(f.kind==='orbit'&&d2(b.x,b.y,f.x,f.y)<64){kill=true;break}
    }
    if(kill){burst(b.x,b.y,2,b.col,1);G.ebul.splice(i,1)}
  }

function addCreep(x,y,r,life,kind,friendly){if(G.creeps.length<220)G.creeps.push({x,y,r,life,max:life,kind,friendly})}

    if(--c.life<=0){G.creeps.splice(i,1);continue}
    if(c.friendly){if(G.t%10===0)for(const e of G.enemies)if(!e.dead&&!e.fly&&d2(c.x,c.y,e.x,e.y)<(c.r+e.r)**2)hurtEnemy(e,1+p.dmg*.15,null)}
    else if(!p.flags.creepImmune&&!isFlying(p)&&c.life<c.max-10&&d2(c.x,c.y,p.x,p.y)<(c.r+p.r-2)**2)damagePlayer(dmgUnit(),'a puddle')
  }
  for(let i=G.warns.length-1;i>=0;i--)if(--G.warns[i].t<=0)G.warns.splice(i,1);
  for(let i=G.hazards.length-1;i>=0;i--){
    const h=G.hazards[i];h.t--;

    if(h.t<=0)G.hazards.splice(i,1);

  for(let i=G.lasers.length-1;i>=0;i--){

    if(L.t===L.tele){AU.play('laser');addShake(.25);const sx=L.o==='h'?L.spike:L.pos,sy=L.o==='h'?L.pos:L.spike;P.ring(sx,sy,8,1.5,FX.next()*TAU,{col:'#7ff5e6'})}

function spawnEnemy(type,x,y,o){

    spawnT:40,fly:!!def.fly,elite:false,dead:false,inv:false,hidden:false,seed:FX.next(),boss:!!def.boss};
  Object.assign(e,o);e.maxhp=e.hp;

function spawnChoir(x,y,spawnT){const grp={cx:x,cy:y,a:0,m:[],k:0,rage:false};for(let i=0;i<3;i++)grp.m.push(spawnEnemy('choir',x,y,{grp,idx:i,spawnT:spawnT==null?40:spawnT}));grp.lead=grp.m[0];return grp}
function updateEnemies(){
  const p=G.player,slow=G.slowT>0;
  for(const e of G.enemies){
    if(e.dead)continue;
    if(e.spawnT>0){e.spawnT--;continue}
    if(e.flash>0)e.flash--;
    if(e.stun>0)e.stun--;
    if(e.fear>0)e.fear--;
    if(slow&&(G.t&1))continue;
    if(e.slow>0){e.slow--;if(G.t%3===0)continue}
    e.t++;
    if(e.burn>0){e.burn--;if(e.burn%15===0){hurtEnemy(e,1+p.dmg*.25,null);burst(e.x,e.y-4,3,'#ff6a2a',1)}if(e.dead)continue}
    if(e.poison>0){e.poison--;if(e.poison%20===0)hurtEnemy(e,.8+p.dmg*.2,null);if(e.dead)continue}
    e.def.update(e);
    if(Math.abs(e.kx)+Math.abs(e.ky)>.05){moveEnemy(e,e.kx,e.ky);e.kx*=.78;e.ky*=.78}else{e.kx=0;e.ky=0}
    if(!e.hidden&&!e.harmless&&!p.dead){
      const rr=e.r+p.r-2;
      if(d2(e.x,e.y,p.x,p.y)<rr*rr)damagePlayer(dmgUnit(),e.def.name);
      else if(p.twin&&d2(e.x,e.y,p.twin.x,p.twin.y)<rr*rr)damagePlayer(dmgUnit(),e.def.name);
    }
  }
  // smoothed per-frame velocity for auto-fire to lead with; teleports reset it
  for(const e of G.enemies){const dx=e.x-(e.px==null?e.x:e.px),dy=e.y-(e.py==null?e.y:e.py);if(dx*dx+dy*dy>36){e.mvx=0;e.mvy=0}else{e.mvx=lerp(e.mvx||0,dx,.3);e.mvy=lerp(e.mvy||0,dy,.3)}e.px=e.x;e.py=e.y}
  if(G.enemies.some(e=>e.dead))G.enemies=G.enemies.filter(e=>!e.dead);
}
function onMusicEvent(ev){
  if(G.state!=='play')return;
  for(const e of G.enemies)if(!e.dead&&e.spawnT<=0&&e.def.onEvent)e.def.onEvent(e,ev);
  const p=G.player;
  if(ev==='bar'&&p.flags.sadsong&&G.locked){G.sadBar=(G.sadBar||0)+1;if(G.sadBar%2===0)for(let i=0;i<6;i++)spawnTear(p.x,p.y,i/6*TAU,p,{fl:Object.assign({},p.flags,{homing:1}),dmgMul:.8})}
  if(ev==='drop')addShake(.35);
}

    const cw=600,chh=315,S=2,cv=mkCanvas(cw*S,chh*S),c=cv.getContext('2d');c.scale(S,S);c.imageSmoothingEnabled=false;
    const g=c.createLinearGradient(0,0,0,chh);g.addColorStop(0,r.win?'#1a1026':'#140810');g.addColorStop(1,'#050208');c.fillStyle=g;c.fillRect(0,0,cw,chh);
    c.strokeStyle='rgba(170,190,230,.16)';c.beginPath();for(let i=0;i<110;i++){const x=(i*97)%cw,y=(i*53+i*i)%chh;c.moveTo(x,y);c.lineTo(x-2,y+9)}c.stroke();
    c.fillStyle='rgba(255,79,123,.5)';c.fillRect(0,0,cw,3);

    txt(c,r.win?'The End':(r.killer==='going home early'?'Gone Home':'You Died'),26,62,{font:F_T,size:26,col:r.win?'#ffd6e4':'#c21e3a'});
    wrapText(c,epitaph(r),340,16).slice(0,3).forEach((l,i)=>txt(c,l,26,98+i*16,{font:F_X,size:16,col:'#d8cce4'}));
    const spr=playerSprites(r.char.invisible?CHARS[0]:r.char).down;
    c.save();c.translate(486,128);c.scale(7,7);if(r.char.invisible)c.globalAlpha=.25;c.drawImage(spr,-8,-12);c.restore();c.globalAlpha=1;
    txt(c,r.char.name,486,176,{align:'center',font:F_T,size:18});
    const mods=MODS.filter(x=>r.mods&&r.mods[x.id]).map(x=>tr(x.n)).join(' · ');
    const rows=[['SCORE',r.score+' · '+tr(DIFFS[r.diff||0].l)],['FLOOR',floorOf(r).ro+' · '+tr(floorOf(r).n)],['KILLS',r.kills],...(mods?[['MODIFIERS',mods]]:[]),['RUN CODE',r.seedStr]];
    rows.forEach(([k,v],i)=>{txt(c,k,26,160+i*17,{size:9,col:'#8f86a0'});txt(c,fitText(c,String(v),300,9),126,160+i*17,{size:9,col:k==='RUN CODE'?'#ffd23f':'#fff'})});
    r.items.slice(0,26).forEach((it,i)=>c.drawImage(itemIcon(it),26+(i%26)*21,262,18,18));
    txt(c,location.host+location.pathname,cw-14,chh-14,{align:'right',font:F_X,size:12,col:'#6a607a'});
    G.shareCanvas=cv;
    // the file has to be ready before the tap: phones only allow sharing right inside the tap
    cv.toBlob(b=>{if(b&&G.shareCanvas===cv){try{G.shareFile=new File([b],'sorrowbloom-'+r.seedStr+'.png',{type:'image/png'})}catch(e){}}},'image/png');
  }catch(e){console.error(e)}
}
function shareRun(){
  const r=G.run;if(!r)return;
  const url=shareURL(r.seedStr),text=shareText(r),f=G.shareFile;
  try{
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Sorrowbloom',text:text+' '+url}).catch(()=>{});return}
    if(navigator.share){navigator.share({title:'Sorrowbloom',text,url}).catch(()=>{});return}
  }catch(e){}
  // no share sheet (most desktops): save the picture and copy the link instead
  try{if(G.shareCanvas){const a=document.createElement('a');a.download='sorrowbloom-'+r.seedStr+'.png';a.href=G.shareCanvas.toDataURL('image/png');a.click()}}catch(e){}
  G.shareMsg='Picture saved.';AU.play('select');
  try{navigator.clipboard.writeText(text+' '+url).then(()=>{G.shareMsg='Picture saved and link copied.'},()=>{})}catch(e){}
}

// ---------- run / floor / room flow ----------
function startRun(charId,o){
  o=o||{};
  const ch=CHARS.find(c=>c.id===charId)||CHARS[0];
  // everything seeded keys off the run code, so typing one in replays that night
  const seedStr=o.weekly?o.weekly.seedStr:o.seedStr||seedString(o.seed!=null?o.seed>>>0:(Math.random()*4294967296)>>>0);
  const seed=hashStr(seedStr),rng=new RNG(hashStr(seedStr+':pools'));
  let diffId=o.tutorial?0:(Save.d.opts.diff|0);if(!diffOk(diffId))diffId=0;
  const mods={},pick=o.weekly?o.weekly.mods:Save.d.mods;if(!o.tutorial)for(const x of MODS)if(pick&&pick[x.id])mods[x.id]=true;
  const run={seed,seedStr,rng,char:ch,depth:1,items:[],taken:{},diff:diffId,hard:diffId===3||diffId===5,mods,mult:runMult(diffId,mods),daily:!!o.daily,dailyKey:o.daily?dateKey():null,
    mode:o.mode||'story',loop:0,round:0,weekly:o.weekly?o.weekly.key:null,splits:[],curseBonus:0,perks:o.tutorial||o.daily||o.weekly?{}:activePerks(),
    tutorial:!!o.tutorial,kills:0,frames:0,bossKills:0,killer:null,newUnlocks:[],pools:null,candyMap:null,candyKnown:{},hurtBoss:false,hurtRoom:false,secrets:0,win:null,lastHurt:null};
  const pools={t:[],s:[],b:[],c:[]};
  for(const it of ITEMS){if(it.lock&&!isUnlocked(it.lock))continue;if(ch.items.includes(it.id))continue;for(const k of'tsbc')if(it.pool.includes(k))pools[k].push(it.id)}
  for(const k in pools)rng.shuffle(pools[k]);
  run.pools=pools;
  const fx=rng.shuffle(CANDY_FX.map((_,i)=>i));run.candyMap=CANDY_COLS.map((_,i)=>fx[i]);
  G.run=run;G.player=makePlayer(ch);G.hist=[];G.toasts=[];G.banner=null;G.sadBar=0;G.mapToggle=false;G.tut=run.tutorial?{step:0,entered:false,t:0,moved:0}:null;
  if(run.tutorial){G.player.candles=1;run.pools={t:[],s:[],b:[],c:[]};for(const k in pools)run.pools[k]=pools[k]}
  for(const id of ch.items){const it=ITEM[id];run.taken[id]=1;if(it.active){G.player.active=it;G.player.charge=it.active.charge;run.items.push(it)}else{G.player.items.push(it);run.items.push(it);if(it.fam)for(const f of it.fam)addFam(G.player,f)}}
  recalc(G.player);
  applyHeartMods(G.player,mods);if(mods.sellout)G.player.pins+=20;applyPerks(G.player,run.perks);
  if(!run.tutorial){Save.d.stats.runs++;Save.d.lastChar=ch.id;charStats(ch.id).runs++;clearRunSave()}
  if(run.daily)Save.d.daily[dateKey()]={done:false,score:0,diff:diffId};
  Save.write();
  G.state='play';
  enterFloor(1);
  if(mods.handmedowns)handMeDowns();
}
function charStats(id){const a=Save.d.chars||(Save.d.chars={});return a[id]||(a[id]={runs:0,wins:0,best:0,deep:0})}
function applyHeartMods(p,mods){
  if(!mods.reckless&&!mods.hopeful&&!mods.handmedowns)return;
  const adj=h=>{if(mods.reckless)h=1;if(mods.hopeful)h+=2;if(mods.handmedowns)h-=1;return Math.max(1,h)};
  if(p.noRed){const n=adj(p.ch.black);p.extras=[];for(let i=0;i<n;i++)addExtra(p,'black',2)}
  else{const n=adj(p.ch.hearts);p.maxRed=p.red=n*2}
}
// two passive items from the treasure pool; actives go back so a starting active isn't replaced
function handMeDowns(){
  const run=G.run,p=G.player,got=[],skipped=[];
  for(let k=0;k<8&&got.length<2;k++){const it=drawItem('t');if(!it)break;if(it.active){skipped.push(it.id);continue}giveItem(it);got.push(tr(it.n))}
  for(const id of skipped){delete run.taken[id];run.pools.t.unshift(id)}
  p.holdT=0;p.holdItem=null;G.banner=null;
  if(got.length)toast('Hand-me-downs',got.join(' · '),'#ff8fc8');
}
function setupFloor(d,restoring){
  const run=G.run;run.depth=d;
  // floor II is sometimes the mall instead of the street (boss rush picks per round)
  {const L0=loopKey(),vr=new RNG(hashStr(run.seedStr+':var'+d+L0));let def=FLOORS[d-1];
    if(!run.tutorial){if(run.mode==='rush'){if(ROUNDS[run.round].fl==='mall')def=MALL}else if(d===2&&vr.chance(.5))def=MALL}
    G.floorDef=def;run.flKey=def===MALL?'mall':null}
  const L=loopKey();
  G.floor=run.tutorial?genTutorialFloor():run.mode==='rush'?genRushFloor(run.round):genFloor(new RNG(hashStr(run.seedStr+':floor'+d+L)),d);
  {const ar=new RNG(hashStr(run.seedStr+':alt'+d+L));G.floor.alt=run.tutorial?null:run.mode==='rush'?ROUNDS[run.round].boss:G.floorDef===MALL?null:(d<=2&&ar.chance(.4))?'opening':(d>=3&&d<=4&&ar.chance(.4))?'angel':(d===5&&ar.chance(.35))?'ex':(d===6&&ar.chance(.35))?'nightbus':null}
  if(run.mods.sellout)for(const r of G.floor.rooms.values())if(r.type==='treasure'){r.type='shop';r.sold=true} // Sellout: same items, but you pay
  G.tileSpr=buildTileSprites(G.floorDef,d);
  Music.setSong(makeSong(hashStr(run.seedStr+':song'+d+L),d,G.floorDef));Music.setMode('explore');
  AU.setAmbience(G.floorDef.amb);AU.setMuffle(G.floorDef.water?2400:18000);
  const p=G.player;
  G.floor.curse=null;
  if(!run.tutorial&&run.mode!=='rush'&&d>=2&&d<7){const cr=new RNG(hashStr(run.seedStr+':curse'+d+L));if(cr.chance(.25))G.floor.curse=cr.pick(Object.keys(CURSES))}
  if(!restoring){
    if(run.perks&&run.perks.sketch)revealMap(1);
    if(d>=3)grantAch('floor3');if(d>=4)grantAch('floor4');
    if(p.items.some(i=>i.mood))rollMood(p);
    hooks('floor');
  }
  for(const it of p.items)if(it.reveal)revealMap(it.reveal);
  G.void=false;G.border=0;
  initWeather();
}
function enterFloor(d){
  setupFloor(d,false);
  const p=G.player;
  enterRoom(G.floor.start,null);
  p.x=CX;p.y=CY+10;G.hist=[];
  const r=G.run,card={type:'floor',t:0,dur:150};
  if(r.mode==='rush'){card.sub=tr('ROUND {0} / {1}',r.round+1,ROUNDS.length);card.title=tr(BOSS[ROUNDS[r.round].boss].name)}
  else if(r.loop)card.sub=tr('FLOOR')+' '+G.floorDef.ro+' · '+tr('LOOP {0}',r.loop+1);
  if(!r.tutorial&&(d>1||r.loop||r.round))takeSplit();
  if(G.floor.curse){card.curse=G.floor.curse;G.fx.push({t:100,f:()=>{toast(CURSES[G.floor.curse].n,CURSES[G.floor.curse].f,'#c21e3a');AU.play('curse')}})}
  floorTexts(d);
  if(G.trans&&G.trans.type==='fade')G.trans.after=card;else G.trans=card;
}
function descend(){
  if(G.run.tutorial){finishTutorial();return}
  const r=G.run;let next=r.depth+1;
  if(r.mode==='rush'){if(r.round>=ROUNDS.length-1)return;r.round++;next=ROUNDS[r.round].d}
  else if(r.depth>=7){if(r.mode!=='encore')return;r.loop++;next=1}
  AU.play('fall');
  G.trans={type:'fade',t:0,dur:40,mid:()=>enterFloor(next),keep:true};
}
function enterRoom(room,fromDir){
  G.room=room;if(!room.built)buildRoom(room);
  G.enemies=[];G.tears=[];G.ebul=[];G.creeps=[];G.bombs=[];G.fx=[];G.lasers=[];G.zaps=[];G.warns=[];G.hazards=[];G.tmpLights=[];G.shock=null;G.beams=[];G.ghosts=[];G.nums=[];G.outage=false;G.bossDying=false;
  G.pickups=room.pickups;G.roomT=0;G.extraDark=0;G.boss=null;G.run.hurtRoom=false;G.border=0;G.locked=false;G.void=false;
  const p=G.player;
  if(fromDir){const o={u:[CX,OY+IH-10],d:[CX,OY+10],l:[OX+IW-10,CY],r:[OX+10,CY]}[fromDir];p.x=o[0];p.y=o[1]}
  else{p.x=CX;p.y=CY+10}
  p.vx*=.3;p.vy*=.3;G.hist=[];
  room.visited=true;room.seen=true;
  for(const d in room.doors){const dd=room.doors[d];if(!dd.link.secret||dd.link.revealed)dd.to.seen=true}
  if(room.type==='secret'){for(const d in room.doors)room.doors[d].link.revealed=true;if(!room.counted){room.counted=true;G.run.secrets++;Save.d.stats.secrets++;if(Save.d.stats.secrets>=3)grantAch('secret')}}
  G.flowT=0;computeFlow();
  saveRun();
  if(!room.cleared){
    if(room.type==='boss'){startBoss(room);return}
    if(room.spec.length){
      for(const s of room.spec){
        const c=randomCell({minDist:95,fly:EN[s.type].fly})||randomCell({fly:true})||{x:CX,y:CY};
        if(s.type==='choir')spawnChoir(c.x,c.y);else spawnEnemy(s.type,c.x,c.y,{elite:s.elite});
      }
      if(G.floor.curse==='haunted'){const c=randomCell({minDist:80,fly:true})||{x:CX,y:CY};spawnEnemy('echo',c.x,c.y)}
      if(G.run.perks&&G.run.perks.setlist)p.hype=Math.min(100,(p.hype||0)+25);
      G.locked=true;G.roomStartCount=G.enemies.length;AU.play('lock');Music.setMode('combat');
      if(p.flags.earplugs)p.plug=true;
      if(room.outage){G.extraDark=.32;G.outage=true;toast('The power went out.','','#9aa7ff')}
      G.fx.push({t:42,f:()=>hooks('roomEnter',room)});
      return;
    }
    room.cleared=true;
  }
  Music.setMode('explore');
}
function checkClear(){
  if(!G.locked||G.boss||G.bossDying)return;
  const alive=liveEnemies();
  if(alive>0){if(alive<=1&&G.roomStartCount>=3&&Music.mode==='combat')Music.setMode('last');return}
  if(G.enemies.length)return;
  G.locked=false;G.room.cleared=true;AU.play('unlock');Music.setMode('clear');
  if(G.outage){G.outage=false;G.extraDark=0;toast('The lights flicker back on.','','#9aa7ff')}
  const p=G.player;if(p.active)p.charge=Math.min(p.active.active.charge,p.charge+1);
  hooks('roomClear');
  if(p.trans.acoustic)healRed(p,1);
  const chance=.5+p.luck*.04+(p.flags.caller?.3:0);
  for(let n=0;n<dropMul();n++)if(FX.chance(chance)){const k=rollDrop(FX,false);if(k)spawnPickup(k,CX+n*14,CY)}
  if(p.flags.caller&&FX.chance(.3)){const k=rollDrop(FX,true);if(k)spawnPickup(k,CX+12,CY)}
  saveRun();
}

const wb=mkCanvas(W,H),WB=wb.getContext('2d');
const lc=mkCanvas(W,H),LC=lc.getContext('2d');
function part(x,y,vx,vy,col,life,size){if(G.parts.length>900)return;G.parts.push({x,y,vx,vy,col,life,max:life,size:size||1})}
function burst(x,y,n,col,spd){for(let i=0;i<n;i++){const a=FX.range(0,TAU),s=FX.range(.2,1)*spd;part(x,y,Math.cos(a)*s,Math.sin(a)*s,col,FX.int(14,32),FX.chance(.3)?2:1)}}

  const bg=G.room&&G.room.bg;if(!bg)return;const c=bg.getContext('2d');
  c.save();c.beginPath();c.rect(OX,OY,IW,IH);c.clip();c.fillStyle=rgba(col,.55);
  for(let i=0;i<7;i++){const a=FX.range(0,TAU),d=FX.range(0,r);c.beginPath();c.arc(x+Math.cos(a)*d,y+Math.sin(a)*d*.6,FX.range(1,r*.45),0,TAU);c.fill()}

function updateParticles(){for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.93;p.vy*=.93;if(--p.life<=0)G.parts.splice(i,1)}}

const STAMP=(()=>{const c=mkCanvas(64,64),x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.4,'rgba(0,0,0,.85)');g.addColorStop(.75,'rgba(0,0,0,.35)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return c})();

const TEARS={tear:{core:'#d8ecff',rim:'#4a6aa8',glow:'#9fc0ff'},ink:{core:'#1e1230',rim:'#a06bff',glow:'#a06bff'},blood:{core:'#ff2d4b',rim:'#5a0010',glow:'#ff3b5c'},petal:{core:'#ff9ac0',rim:'#8a1a4a',glow:'#ff8fb8'},fire:{core:'#fff0b0',rim:'#ff6a2a',glow:'#ffb347'}};
function tearCol(t){if(t.style==='rainbow'){const h=(t.age*8+t.wob*60)%360;return{core:`hsl(${h},100%,80%)`,rim:`hsl(${h},90%,45%)`,glow:'#ff8fc8'}}return TEARS[t.style]||TEARS.tear}
function collectLights(){
  const L=[],p=G.player,fl=G.floorDef,t=G.t;
  if(!p.dead)L.push({x:p.x,y:p.y-4,r:96+p.light+(p.lighterT>0?60:0),i:1});
  for(const l of G.room.lights){let r=l.r;if(l.fl===1)r*=.85+.15*Math.sin(t*.2+l.x);if(l.fl===2&&FX.chance(.02))r*=.3;if(l.tw!=null)r*=.8+.2*Math.sin(t*.05+l.tw);L.push({x:l.x,y:l.y,r,i:.9,col:l.col})}
  for(const tw of G.tears)L.push({x:tw.x,y:tw.y,r:tw.style==='tear'?14:22,i:.55});
  for(const b of G.ebul)if(G.ebul.length<160)L.push({x:b.x,y:b.y,r:10,i:.3});
  for(const e of G.enemies){if(e.def.light&&!e.dead)L.push({x:e.x,y:e.y,r:e.def.light,i:.8,col:'#ff8a3c'})}
  for(let cy=0;cy<RR;cy++)for(let cx=0;cx<RC;cx++)if(G.room.tiles[cy*RC+cx]===T_FIRE){const c=cellCenter(cx,cy);L.push({x:c.x,y:c.y-4,r:46+Math.sin(t*.3+cx)*4,i:1,col:'#ff8a3c'})}
  for(const pk of G.pickups)if(pk.kind==='candle')L.push({x:pk.x,y:pk.y-4,r:18,i:.7});
  for(const ped of G.room.peds)if(ped.item)L.push({x:ped.x,y:ped.y-10,r:30,i:.7,col:fl.acc});
  for(const o of G.room.objects)L.push({x:o.x,y:o.y,r:34,i:.7,col:o.kind==='booth'?'#9a2a5a':'#ffd6e4'});
  if(G.room.trapdoor)L.push({x:G.room.trapdoor.x,y:G.room.trapdoor.y,r:24,i:.6});
  for(const h of G.hazards)L.push({x:h.x,y:h.y,r:34,i:1,col:'#ff6a2a'});
  for(const l of G.tmpLights)L.push({x:l.x,y:l.y,r:l.r*(l.t/l.max),i:1,col:l.col});
  for(const L2 of G.lasers)if(L2.t>=L2.tele){const n=8;for(let k=0;k<n;k++){const s=OX+k*IW/(n-1);L.push(L2.o==='h'?{x:s,y:L2.pos,r:24,i:.8}:{x:L2.pos,y:OY+k*IH/(n-1),r:24,i:.8})}}

}
function renderLighting(c){

function initWeather(){
  const w=G.floorDef.weather,n={dust:40,rain:130,petals:26,static:0,bubbles:30,ash:70,snowash:50}[w]||0;
  G.weather=[];for(let i=0;i<n;i++)G.weather.push({x:FX.range(0,W),y:FX.range(0,H),v:FX.range(.4,1),a:FX.range(0,TAU)});
}
function updateWeather(kind){
  kind=kind||G.floorDef.weather;
  for(const d of G.weather){
    if(kind==='rain'){d.x-=1.2*d.v;d.y+=6*d.v}
    else if(kind==='dust'){d.x+=Math.sin(G.t*.01+d.a)*.15;d.y+=Math.cos(G.t*.013+d.a)*.12}
    else if(kind==='petals'){d.x+=Math.sin(G.t*.02+d.a)*.4;d.y+=.35*d.v;d.a+=.03}
    else if(kind==='bubbles'){d.y-=.5*d.v;d.x+=Math.sin(G.t*.05+d.a)*.2}
    else if(kind==='ash'){d.x+=.3+Math.sin(G.t*.02+d.a)*.3;d.y+=.4*d.v}
    else if(kind==='snowash'){d.y+=.25*d.v;d.x+=Math.sin(G.t*.01+d.a)*.2}
    if(d.y>H)d.y-=H;if(d.y<0)d.y+=H;if(d.x<0)d.x+=W;if(d.x>W)d.x-=W;
  }
}
function drawWeather(c,kind){

  if(kind==='rain'){c.strokeStyle='rgba(170,190,230,.28)';c.lineWidth=1;c.beginPath();for(const d of G.weather){c.moveTo(d.x,d.y);c.lineTo(d.x-1.5*d.v,d.y+7*d.v)}c.stroke()}
  else if(kind==='dust'){c.fillStyle='rgba(255,230,240,.18)';for(const d of G.weather)c.fillRect(d.x,d.y,1,1)}
  else if(kind==='petals'){c.fillStyle='rgba(255,143,184,.55)';for(const d of G.weather){c.save();c.translate(d.x,d.y);c.rotate(d.a);c.fillRect(-1.5,-.5,3,1.5);c.restore()}}
  else if(kind==='bubbles'){c.strokeStyle='rgba(160,200,255,.35)';for(const d of G.weather){c.beginPath();c.arc(d.x,d.y,1+d.v*1.5,0,TAU);c.stroke()}}
  else if(kind==='ash'){for(const d of G.weather){c.fillStyle=d.v>.9?'rgba(255,120,50,.7)':'rgba(140,130,130,.45)';c.fillRect(d.x,d.y,1+(d.v>.7?1:0),1)}}

// what each floor sounds like underfoot, and what each boss sounds like when it changes
const STEP_OF={bedroom:'carpet',rain:'wet',chapel:'stone',hospital:'squeak',water:'water',ash:'ash',last:'wood',mall:'tile'};
const BOSS_STING={moths:'wings',gutter:'buzz',choirm:'sing',flatline:'flatline',bride:'scream',saint:'flame',you:'whisper',mascot:'cheer',ex:'vibrate',nightbus:'horn',opening:'blegh',angel:'camera'};

// ---------- hype / encore, dash, weapons, beams ----------
function addHype(p,v){if(p.encore>0)return;const lv=Math.floor((p.hype||0)/25);p.hype=Math.min(100,(p.hype||0)+v);if(p.hype<100&&Math.floor(p.hype/25)>lv)AU.play('hype',{lv:Math.floor(p.hype/25)});p.hypeT=150;if(p.hype>=100){p.hype=0;p.encore=480;banner('ENCORE!','The crowd goes wild.',null,'#ffd23f');AU.play('crowd');flashScreen(.2);grantAch('crowd')}}
function fireBeam(p,a){
  const n=p.multi;for(let i=0;i<n;i++){const aa=a+(i-(n-1)/2)*.17;G.beams.push({a:aa,t:16,dmg:shotDamage(p)*1.35*(p.encore>0?1.5:1),twin:false});if(p.twin)G.beams.push({a:Math.PI-aa,t:16,dmg:shotDamage(p)*1.35,twin:true})}
  AU.play('laser');addShake(.25);
}
function beamEnd(x,y,a){let t=0;const dx=Math.cos(a),dy=Math.sin(a);while(t<600){const nx=x+dx*t,ny=y+dy*t;if(nx<OX||nx>OX+IW||ny<OY||ny>OY+IH)break;t+=4}return{x:x+dx*t,y:y+dy*t,len:t}}
function updateBeams(){
  const p=G.player;
  for(let i=G.beams.length-1;i>=0;i--){
    const b=G.beams[i];b.t--;b.x=b.twin?p.twin.x:p.x;b.y=(b.twin?p.twin.y:p.y)-3;
    if(b.t%4===0){const end=beamEnd(b.x,b.y,b.a),dx=Math.cos(b.a),dy=Math.sin(b.a);
      for(const e of G.enemies){if(e.dead||e.spawnT>0)continue;const vx=e.x-b.x,vy=e.y-b.y,pr=vx*dx+vy*dy;if(pr<0||pr>end.len)continue;const perp=Math.abs(vx*dy-vy*dx);if(perp<e.r+6){if(hurtEnemy(e,b.dmg,null)&&!e.boss&&!e.def.heavy){e.kx+=dx*1.5;e.ky+=dy*1.5}}}
      if(b.t%8===0)burst(end.x,end.y,4,'#ff8fc8',1.6)}
    if(b.t<=0)G.beams.splice(i,1);
  }
  for(let i=G.ghosts.length-1;i>=0;i--)if(--G.ghosts[i].t<=0)G.ghosts.splice(i,1);
  for(let i=G.nums.length-1;i>=0;i--){const n=G.nums[i];n.y-=.35;if(--n.t<=0)G.nums.splice(i,1)}
}
function drawBeams(c){
  const p=G.player;
  for(const b of G.beams){const e=beamEnd(b.x,b.y,b.a),w=b.t/16;c.strokeStyle=`rgba(255,79,123,${.5*w})`;c.lineWidth=10*w+2;c.beginPath();c.moveTo(b.x,b.y);c.lineTo(e.x,e.y);c.stroke();c.strokeStyle='#fff0f6';c.lineWidth=3*w+1;c.stroke();c.lineWidth=1}
  if(p.lz>0){const max=Math.max(24,p.fireDelay*2.6),k=p.lz/max;c.strokeStyle=k>=1?(G.t>>2&1?'#fff':'#ff4f7b'):'rgba(255,79,123,.7)';c.beginPath();c.arc(p.x,p.y-3,4+k*10,0,TAU*k);c.stroke()}
  if(Save.d.opts.dmgNums)for(const n of G.nums)txt(c,n.v,n.x,n.y,{align:'center',col:n.crit?'#ff3b30':'#ffffff',alpha:Math.min(1,n.t/15)});
}
function drawAimLine(c,p){
  if(!p.firing||p.dead||Input.dev==='kb'||G.state!=='play')return;
  const tgt=p.autoAim?p.autoT:p.assistT,ox=p.x,oy=p.y-3;
  if(!p.autoAim&&Save.d.opts.aimLine){
    const a=Math.atan2(p.aimY,p.aimX),dx=Math.cos(a),dy=Math.sin(a);let len=p.range;
    if(tgt)len=Math.min(len,Math.sqrt(d2(ox,oy,tgt.x,tgt.y)));
    for(let k=8;k<len;k+=4){const x=ox+dx*k,y=oy+dy*k;if(x<OX||x>OX+IW||y<OY||y>OY+IH){len=k;break}
      if(!p.flags.spectral){const[cx,cy]=cellOf(x,y),t=tileAtCell(cx,cy);if(t===T_ROCK||t===T_BLOCK){len=k;break}}}
    c.fillStyle=tgt?'#ff8fc8':'#e9e1f0';
    for(let k=10;k<len;k+=7){c.globalAlpha=(tgt?.8:.45)*(1-k/(len+24));c.fillRect(ox+dx*k-1,oy+dy*k-1,2,2)}
    c.globalAlpha=1;
  }
  if(tgt&&!tgt.dead&&(Save.d.opts.aimLine||p.autoAim)){const r=tgt.r+4,k=3;c.strokeStyle='#ff8fc8';c.globalAlpha=.85;c.beginPath();
    for(const[sx,sy]of[[-1,-1],[1,-1],[1,1],[-1,1]]){c.moveTo(tgt.x+sx*r,tgt.y+sy*(r-k));c.lineTo(tgt.x+sx*r,tgt.y+sy*r);c.lineTo(tgt.x+sx*(r-k),tgt.y+sy*r)}
    c.stroke();c.globalAlpha=1}
}
function drawGhosts(c){const p=G.player;if(p.invisible)return;const spr=playerSprites(p.ch,p.scene);for(const g of G.ghosts){c.globalAlpha=g.t/24;c.save();c.translate(g.x|0,g.y|0);if(g.face==='side'&&g.flip)c.scale(-1,1);c.drawImage(spr[g.face],-8,-12);c.restore()}c.globalAlpha=1}

    {l:'RESET CONTROLS',small:true,v:()=>'',act:d=>{if(!d){o.binds={};applyBinds()}}}];

  rows.push({l:'BACK',v:()=>'',back:true});

// fullscreen + landscape lock. iPhone Safari has no fullscreen API: there the home screen icon is the fullscreen mode.
const isFull=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
const canFull=()=>{const d=document.documentElement;return!!(d.requestFullscreen||d.webkitRequestFullscreen)};
const isInstalled=()=>matchMedia('(display-mode: fullscreen)').matches||matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function lockLandscape(){try{const o=screen.orientation;if(o&&o.lock)o.lock('landscape').catch(()=>{})}catch(e){}}
function enterFull(){const d=document.documentElement;try{const r=(d.requestFullscreen||d.webkitRequestFullscreen).call(d,{navigationUI:'hide'});if(r&&r.then)r.then(lockLandscape,()=>{});else lockLandscape()}catch(e){}}
function toggleFull(){try{if(isFull())(document.exitFullscreen||document.webkitExitFullscreen).call(document);else enterFull()}catch(e){}}
let autoFulled=false;
function autoFull(){if(autoFulled)return;autoFulled=true;if(isInstalled()){lockLandscape();return}if(!isFull()&&canFull())enterFull()}
function inRect(p,r){return p.x>=r[0]&&p.x<=r[0]+r[2]&&p.y>=r[1]&&p.y<=r[1]+r[3]}
let lastPtr={x:-1,y:-1};
function menuNav(n){
  const m=G.menu;
  if(Input.pressed('mu')){m.sel=(m.sel+n-1)%n;AU.play('blip')}
  if(Input.pressed('md')){m.sel=(m.sel+1)%n;AU.play('blip')}
  const moved=Input.ptr.x!==lastPtr.x||Input.ptr.y!==lastPtr.y;lastPtr={x:Input.ptr.x,y:Input.ptr.y};
  if(m.rects){
    if(moved&&Input.ptr.mouse)m.rects.forEach((r,i)=>{if(r&&inRect(Input.ptr,r)&&m.sel!==i){m.sel=i;AU.play('blip')}});
    for(const cl of Input.clicks)for(let i=0;i<m.rects.length;i++)if(m.rects[i]&&inRect(cl,m.rects[i])){m.sel=i;return i}
  }
  if(Input.pressed('ok'))return m.sel;
  return -1;
}
