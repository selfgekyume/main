<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050208">
<title>Sorrowbloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Silkscreen&family=VT323&display=swap">
<style>
/* One look by design: it is always night. The game renders at 480x270 and is scaled up nearest-neighbour. */
:root{--bg:#050208;--ink:#e9e1f0;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
#screen{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.crt{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,.14) 3px);mix-blend-mode:multiply}
noscript{color:var(--ink);font:20px monospace;position:fixed;inset:0;display:grid;place-items:center}
</style>
</head>
<body>
<canvas id="screen" tabindex="0" aria-label="Sorrowbloom, an emo dungeon crawl"></canvas>
<div class="crt"></div>
<noscript>Sorrowbloom needs JavaScript.</noscript>
<script>
'use strict';
/* =====================================================================
   SORROWBLOOM : an emo myspace dungeon crawl
   Sections: 1 config · 2 rng/util · 3 save · 4 view/input · 5 audio
   6 music · 7 sprites · 8 content · 9 world gen · 10 entities/combat
   11 bosses · 12 lighting/fx · 13 ui · 14 main loop
   ===================================================================== */

// ---------- 1. CONFIG ----------
const W=480,H=270,CELL=24,RC=17,RR=9,OX=36,OY=27,IW=RC*CELL,IH=RR*CELL;
const CX=OX+IW/2,CY=OY+IH/2,TAU=Math.PI*2;
const F_T='"Pirata One", serif',F_U='Silkscreen, monospace',F_X='VT323, monospace';
const T_FLOOR=0,T_ROCK=1,T_POT=2,T_PIT=3,T_SPIKE=4,T_BLOCK=5,T_FIRE=6;
const SOLID_W=[0,1,1,1,0,1,1];   // blocks walkers
const BLOCK_SHOT=[0,1,1,0,0,1,1]; // blocks tears and bullets
const TUNE={tearSpeed:3.4,range:165,moveSpeed:1.45,invuln:60,maxHalves:24,doorX:8,doorY:4};

// ---------- 2. RNG / UTIL ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const d2=(ax,ay,bx,by)=>{const x=bx-ax,y=by-ay;return x*x+y*y};
const angTo=(ax,ay,bx,by)=>Math.atan2(by-ay,bx-ax);
const mtof=m=>440*Math.pow(2,(m-69)/12);
function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
class RNG{
  constructor(s){this.f=mulberry32(s>>>0)}
  next(){return this.f()}
  range(a,b){return a+this.f()*(b-a)}
  int(a,b){return a+Math.floor(this.f()*(b-a+1))}
  pick(a){return a[Math.floor(this.f()*a.length)]}
  chance(p){return this.f()<p}
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(this.f()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
}
const FX=new RNG(Date.now()); // cosmetic randomness only, never affects a seeded run
const mkCanvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const SEED_A='ABCDEFGHJKLMNPQRSTVWXYZ23456789';
function seedString(n){let s='';n=n>>>0;for(let i=0;i<8;i++){s+=SEED_A[n%SEED_A.length];n=Math.floor(n/SEED_A.length)+i*7}return s.slice(0,4)+'-'+s.slice(4)}
function dateKey(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

// ---------- 3. SAVE ----------
const SAVE_KEY='sorrowbloom.v1';
const Save={
  d:null,
  fresh(){return{ach:{},seenI:{},gotI:{},seenE:{},bossK:{},
    stats:{runs:0,wins:0,deaths:0,kills:0,secrets:0,confess:0},
    opts:{lang:(navigator.language||'').toLowerCase().startsWith('es')?'es':'en',master:1,music:.75,sfx:.8,shake:1,flash:true,hints:true,autofire:false,aim:false,dmgNums:false,fps:false,crt:true,grain:true,pixel:false,hiContrast:false,touchSize:1,binds:{}},daily:{},best:0,hard:false,lastChar:'wren',tutDone:false}},
  load(){
    let s=null;try{s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){s=null}
    const f=this.fresh();
    if(s&&typeof s==='object')for(const k in f){
      if(s[k]===undefined)continue;
      f[k]=(f[k]&&typeof f[k]==='object')?Object.assign(f[k],s[k]):s[k];
    }
    this.d=f;
  },
  write(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(this.d))}catch(e){}}
};
const ACH=[
  {id:'moths',name:'Moth Dust',desc:'Defeat The Mother of Moths',unlock:['char:ash','item:mothwings']},
  {id:'floor3',name:'Getting Deeper',desc:'Reach The Overgrown Chapel',unlock:['item:sadsong']},
  {id:'floor4',name:'Static',desc:'Reach Static Hospital',unlock:['char:juniper']},
  {id:'choir',name:'Encore',desc:'Defeat The Choirmaster',unlock:['item:distortion']},
  {id:'flat',name:'Flatline',desc:'Defeat The Flatline',unlock:['item:staticcassette']},
  {id:'bride',name:'Something Borrowed',desc:'Defeat The Drowned Bride',unlock:['char:twins']},
  {id:'saint',name:'Burn Bright',desc:'Defeat The Ember Saint',unlock:['item:glassheart']},
  {id:'win',name:'The Last Room',desc:'Finish the game',unlock:['char:nobody','mode:hard','item:papercrown']},
  {id:'hug',name:'Stay',desc:'Choose not to fight yourself',unlock:['item:polaroid']},
  {id:'kills',name:'Scene Points',desc:'Kill 250 things in total',unlock:['item:bassdrop']},
  {id:'secret',name:'Behind The Wall',desc:'Find 3 secret rooms',unlock:['item:flashlight']},
  {id:'sad5',name:'Again',desc:'Die 5 times',unlock:['item:ouija']},
  {id:'confess',name:'Confession',desc:'Give up a heart in a confession booth',unlock:['item:ribcage']},
  {id:'flawless',name:'Untouched',desc:'Beat a boss without getting hurt',unlock:['item:top8']},
  {id:'transform',name:'Becoming',desc:'Transform during a run',unlock:['item:awaymsg']},
];
function isUnlocked(key){
  for(const a of ACH)if(a.unlock.includes(key))return !!Save.d.ach[a.id];
  return true;
}
function unlockHint(key){const a=ACH.find(a=>a.unlock.includes(key));return a?a.desc:''}
function grantAch(id){
  if(Save.d.ach[id])return;
  Save.d.ach[id]=Date.now();Save.write();
  const a=ACH.find(x=>x.id===id);
  if(a){toast(tr('UNLOCKED')+': '+tr(a.name),a.desc,'#ffd23f');if(G.run)G.run.newUnlocks.push(a)}
}

// ---------- 4. VIEW / INPUT ----------
const buf=mkCanvas(W,H),B=buf.getContext('2d');
const View={
  cv:null,ctx:null,scale:1,ox:0,oy:0,dpr:1,
  init(){
    this.cv=document.getElementById('screen');this.ctx=this.cv.getContext('2d',{alpha:false});
    addEventListener('resize',()=>this.resize());this.resize();
  },
  resize(){
    const dpr=Math.min(devicePixelRatio||1,3),cw=Math.max(1,innerWidth*dpr|0),ch=Math.max(1,innerHeight*dpr|0);
    this.cv.width=cw;this.cv.height=ch;
    let s=Math.min(cw/W,ch/H);const fs=Math.floor(s);if(Save.d&&Save.d.opts.pixel&&fs>=1)s=fs;else if(fs>=2&&fs/s>0.86)s=fs;
    this.scale=s;this.ox=(cw-W*s)/2|0;this.oy=(ch-H*s)/2|0;this.dpr=dpr;
    this.ctx.imageSmoothingEnabled=false;
  },
  toGame(cx,cy){return{x:(cx*this.dpr-this.ox)/this.scale,y:(cy*this.dpr-this.oy)/this.scale}}
};

const KEYS={up:['KeyW'],down:['KeyS'],left:['KeyA'],right:['KeyD'],
  su:['ArrowUp'],sd:['ArrowDown'],sl:['ArrowLeft'],sr:['ArrowRight'],
  active:['Space'],bomb:['KeyQ'],dash:['ShiftLeft','ShiftRight'],use:['KeyE'],pause:['Escape','KeyP'],map:['Tab'],
  ok:['Enter','Space','KeyZ'],back:['Escape','Backspace','KeyX'],
  mu:['ArrowUp','KeyW'],md:['ArrowDown','KeyS'],ml:['ArrowLeft','KeyA'],mr:['ArrowRight','KeyD'],mute:['KeyM'],full:['KeyF']};
const PADB={ok:[0],back:[1],dash:[1,10],active:[5,7],bomb:[4,6],use:[2,3],pause:[9],map:[8],mu:[12],md:[13],ml:[14],mr:[15]};
// touch buttons (game coordinates)
const TBTN=[{id:'active',x:W-26,y:86,r:14,label:'ITEM'},{id:'bomb',x:W-60,y:110,r:12,label:'CNDL'},{id:'use',x:W-26,y:178,r:11,label:'USE'},{id:'dash',x:W-60,y:150,r:12,label:'DASH'},{id:'pause',x:W-96,y:14,r:10,label:'II'}];
const Input={
  down:new Set(),hit:new Set(),pb:{},pbHit:new Set(),tHit:new Set(),
  ptr:{x:W/2,y:H/2,down:false,mouse:false},clicks:[],
  touches:new Map(),touchUI:false,mapHeld:false,
  move:{x:0,y:0},aim:{x:0,y:0},fire:false,stickPrev:{x:0,y:0},dev:'kb',
  init(cv){
    addEventListener('keydown',e=>{
      if(['Tab','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
      if(G.rebind){e.preventDefault();if(e.code!=='Escape'){Save.d.opts.binds[G.rebind]=e.code;applyBinds();Save.write()}G.rebind=null;return}
      this.dev='kb';
      if(!this.down.has(e.code))this.hit.add(e.code);
      this.down.add(e.code);this.touchUI=false;onUserGesture();
    });
    addEventListener('keyup',e=>this.down.delete(e.code));
    addEventListener('blur',()=>{this.down.clear();this.ptr.down=false;this.touches.clear();onBlur()});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)onBlur()});
    cv.addEventListener('contextmenu',e=>e.preventDefault());
    cv.addEventListener('pointerdown',e=>{
      e.preventDefault();onUserGesture();
      try{cv.setPointerCapture(e.pointerId)}catch(_){}
      const p=View.toGame(e.clientX,e.clientY);
      if(e.pointerType==='touch'){
        this.touchUI=true;this.dev='touch';
        if(G.state==='play'){
          if(inRect(p,[404,4,70,32])){G.mapToggle=!G.mapToggle;this.touches.set(e.pointerId,{role:'btn'});return}
          const ts=Save.d.opts.touchSize;const b=TBTN.find(b=>d2(p.x,p.y,b.x,b.y)<(b.r*ts+6)*(b.r*ts+6));
          if(b){this.tHit.add(b.id);this.touches.set(e.pointerId,{role:'btn'});return}
          this.touches.set(e.pointerId,{role:p.x<W/2?'move':'aim',ox:p.x,oy:p.y,x:p.x,y:p.y});
        }else this.clicks.push(p);
      }else{
        this.ptr.x=p.x;this.ptr.y=p.y;this.ptr.mouse=true;this.dev='kb';this.touchUI=false;
        if(e.button===0){this.ptr.down=true;this.clicks.push(p)}
        if(e.button===2&&G.state==='play')this.tHit.add('active');
      }
    });
    cv.addEventListener('pointermove',e=>{
      const p=View.toGame(e.clientX,e.clientY);
      const t=this.touches.get(e.pointerId);
      if(t){t.x=p.x;t.y=p.y}
      if(e.pointerType!=='touch'){this.ptr.x=p.x;this.ptr.y=p.y;this.ptr.mouse=true}
    });
    const up=e=>{this.touches.delete(e.pointerId);if(e.pointerType!=='touch'&&e.button===0)this.ptr.down=false};
    cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  },
  k(n){return KEYS[n].some(c=>this.down.has(c))},
  pressed(n){return(KEYS[n]&&KEYS[n].some(c=>this.hit.has(c)))||this.pbHit.has(n)||this.tHit.has(n)},
  update(){
    let mx=(this.k('right')?1:0)-(this.k('left')?1:0),my=(this.k('down')?1:0)-(this.k('up')?1:0);
    let ax=(this.k('sr')?1:0)-(this.k('sl')?1:0),ay=(this.k('sd')?1:0)-(this.k('su')?1:0);
    this.mapHeld=this.k('map');
    let gp=null;
    try{const pads=navigator.getGamepads?navigator.getGamepads():[];for(const p of pads)if(p&&p.connected){gp=p;break}}catch(e){}
    if(gp){
      for(const name in PADB){
        const on=PADB[name].some(i=>gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>.5));
        if(on&&!this.pb[name])this.pbHit.add(name);
        this.pb[name]=on;
      }
      if(this.pb.map)this.mapHeld=true;
      if(gp.buttons.some(b=>b&&b.pressed)||gp.axes.some(v=>Math.abs(v)>.5)){this.dev='pad';this.touchUI=false}
      const lx=gp.axes[0]||0,ly=gp.axes[1]||0,rx=gp.axes[2]||0,ry=gp.axes[3]||0;
      if(Math.hypot(lx,ly)>.22){mx=lx;my=ly}
      if(Math.hypot(rx,ry)>.35){ax=rx;ay=ry}
      if(ly<-.6&&this.stickPrev.y>=-.6)this.pbHit.add('mu');
      if(ly>.6&&this.stickPrev.y<=.6)this.pbHit.add('md');
      if(lx<-.6&&this.stickPrev.x>=-.6)this.pbHit.add('ml');
      if(lx>.6&&this.stickPrev.x<=.6)this.pbHit.add('mr');
      this.stickPrev={x:lx,y:ly};
    }
    for(const t of this.touches.values()){
      if(t.role==='move'){const dx=(t.x-t.ox)/20,dy=(t.y-t.oy)/20;mx=dx;my=dy}
      if(t.role==='aim'){const dx=t.x-t.ox,dy=t.y-t.oy;if(dx*dx+dy*dy>25){ax=dx;ay=dy}}
    }
    if(this.ptr.down&&this.ptr.mouse&&G.state==='play'&&G.player){ax=this.ptr.x-G.player.x;ay=this.ptr.y-G.player.y}
    const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
    const al=Math.hypot(ax,ay);if(al>0.01){ax/=al;ay/=al}else{ax=0;ay=0}
    this.move.x=mx;this.move.y=my;this.aim.x=ax;this.aim.y=ay;this.fire=al>0.01;
  },
  endStep(){this.hit.clear();this.pbHit.clear();this.tHit.clear();this.clicks.length=0}
};

// ---------- 5. AUDIO ENGINE ----------
// Everything is synthesized. Guitars are double-tracked (hard L/R), driven into a waveshaper and a cab-ish EQ.
// Drop tuning goes lower every floor: drop C on floor I, down to F#1 in the last room.
const AU={
  ctx:null,ok:false,muted:false,last:{},curves:{},pluckCache:{},
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{this.ctx=new AC({latencyHint:'interactive'})}catch(e){try{this.ctx=new AC()}catch(e2){return}}
    const c=this.ctx;
    const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),nd=nb.getChannelData(0);
    for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    this.noiseBuf=nb;
    this.master=c.createGain();
    const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=8;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.18;
    const lim=c.createDynamicsCompressor();lim.threshold.value=-3;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.001;lim.release.value=.06;
    this.master.connect(comp);comp.connect(lim);lim.connect(c.destination);this.out=lim;
    this.musicLP=c.createBiquadFilter();this.musicLP.type='lowpass';this.musicLP.frequency.value=18000;this.musicLP.Q.value=.9;this.musicLP.connect(this.master);
    this.musicVol=c.createGain();this.musicVol.connect(this.musicLP);
    this.music=c.createGain();this.music.connect(this.musicVol);
    this.sfx=c.createGain();this.sfx.connect(this.master);
    this.verb=c.createConvolver();this.verb.buffer=this.impulse(2.6,2.6);
    const vo=c.createGain();vo.gain.value=.55;this.verb.connect(vo);vo.connect(this.musicLP);
    this.delay=c.createDelay(1.5);this.delay.delayTime.value=.3;
    const fb=c.createGain();fb.gain.value=.36;const dl=c.createBiquadFilter();dl.type='lowpass';dl.frequency.value=2600;
    this.delay.connect(dl);dl.connect(fb);fb.connect(this.delay);
    const dOut=c.createGain();dOut.gain.value=.5;dl.connect(dOut);dOut.connect(this.music);
    this.drums=c.createGain();this.drums.gain.value=.8;this.drums.connect(this.music);
    this.gL=this.gtrChain(-.8);this.gR=this.gtrChain(.8);
    this.bassIn=c.createGain();
    const bs=c.createWaveShaper();bs.curve=this.curve(2.5);
    const blp=c.createBiquadFilter();blp.type='lowpass';blp.frequency.value=260;
    const bo=c.createGain();bo.gain.value=.34;
    this.bassIn.connect(bs);bs.connect(blp);blp.connect(bo);bo.connect(this.music);this.bassOut=bo;
    // crackle + hiss: the tape is old
    const cb=c.createBuffer(1,c.sampleRate*3,c.sampleRate),cd=cb.getChannelData(0);
    for(let i=0;i<cd.length;i++){cd[i]=(Math.random()*2-1)*.04;if(Math.random()<.0007)cd[i]=(Math.random()*2-1)*.9}
    const cs=c.createBufferSource();cs.buffer=cb;cs.loop=true;
    const chp=c.createBiquadFilter();chp.type='highpass';chp.frequency.value=900;
    this.crackle=c.createGain();this.crackle.gain.value=.12;
    cs.connect(chp);chp.connect(this.crackle);this.crackle.connect(this.music);cs.start();
    // rain / water ambience bed
    const rs=c.createBufferSource();rs.buffer=this.noiseBuf;rs.loop=true;
    this.ambF=c.createBiquadFilter();this.ambF.type='bandpass';this.ambF.frequency.value=1400;this.ambF.Q.value=.5;
    this.amb=c.createGain();this.amb.gain.value=0;
    rs.connect(this.ambF);this.ambF.connect(this.amb);this.amb.connect(this.master);rs.start();
    this.ok=true;this.applyVolume();
    Music.resync();
  },
  running(){return!!(this.ctx&&this.ctx.state==='running')},
  now(){return this.running()?this.ctx.currentTime:performance.now()/1000},
  applyVolume(){
    if(!this.ok)return;const o=Save.d.opts,t=this.ctx.currentTime;
    this.musicVol.gain.setTargetAtTime(o.music*.9,t,.05);
    this.sfx.gain.setTargetAtTime(o.sfx,t,.05);
    this.master.gain.setTargetAtTime(this.muted?0:.95*(o.master==null?1:o.master),t,.05);
  },
  setAmbience(kind){
    if(!this.ok)return;const t=this.ctx.currentTime;
    const v={rain:.16,water:.1,ash:.04,static:.035,title:.12}[kind]||0;
    const f={rain:2200,water:300,ash:600,static:5200,title:2200}[kind]||1000;
    this.amb.gain.setTargetAtTime(v,t,.6);this.ambF.frequency.setTargetAtTime(f,t,.3);
  },
  setMuffle(hz){if(this.ok)this.musicLP.frequency.setTargetAtTime(hz,this.ctx.currentTime,.25)},
  duck(amount,dur){if(!this.ok)return;const t=this.ctx.currentTime,g=this.music.gain;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(amount,t+.03);g.linearRampToValueAtTime(1,t+dur)},
  impulse(sec,decay){
    const c=this.ctx,len=c.sampleRate*sec|0,b=c.createBuffer(2,len,c.sampleRate);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}
    return b;
  },
  curve(k){
    if(this.curves[k])return this.curves[k];
    const n=2048,c=new Float32Array(n),tk=Math.tanh(k);
    for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=Math.tanh(k*x)/tk}
    return this.curves[k]=c;
  },
  gtrChain(pan){
    const c=this.ctx,inp=c.createGain();
    const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=95;
    const sh=c.createWaveShaper();sh.curve=this.curve(34);sh.oversample='2x';
    const tight=c.createBiquadFilter();tight.type='highpass';tight.frequency.value=85;tight.Q.value=.7;
    const lo=c.createBiquadFilter();lo.type='peaking';lo.frequency.value=120;lo.gain.value=1.5;lo.Q.value=.9;
    const mid=c.createBiquadFilter();mid.type='peaking';mid.frequency.value=650;mid.gain.value=-6;mid.Q.value=.8;
    const pres=c.createBiquadFilter();pres.type='peaking';pres.frequency.value=2900;pres.gain.value=6;pres.Q.value=.9;
    const cab=c.createBiquadFilter();cab.type='lowpass';cab.frequency.value=5400;cab.Q.value=.7;
    const cab2=c.createBiquadFilter();cab2.type='lowpass';cab2.frequency.value=7000;
    const out=c.createGain();out.gain.value=.24;
    inp.connect(hp);hp.connect(sh);sh.connect(tight);tight.connect(lo);lo.connect(mid);mid.connect(pres);pres.connect(cab);cab.connect(cab2);cab2.connect(out);
    this.panTo(out,pan,this.music);
    return inp;
  },
  panTo(node,pan,dest){
    if(this.ctx.createStereoPanner){const p=this.ctx.createStereoPanner();p.pan.value=pan;node.connect(p);p.connect(dest);return p}
    node.connect(dest);return node;
  },

const SCALES={phry:[0,1,3,5,7,8,10],hmin:[0,2,3,5,7,8,11],minor:[0,2,3,5,7,8,10]};

const BOSS1=['bdHeavy','verseA','blast','verseB','blast','breakdown'];
const BOSS2=['chorus','blast','verseB','chorus','blast','bdHeavy'];

  setMode(m){if(m===this.mode)return;this.mode=m;this.pending=true;this.cyc=0},
  resync(){this.clockAudio=AU.running();this.nextT=AU.now()+.08;this.evq.length=0;this.beats.length=0},
  pick(){

      case 'clear':this.mode='explore';this.cyc=0;return S.end;
      case 'bossintro':this.mode='boss1';this.cyc=0;return S.intro;

const iconCache={};
function iconCanvas(icon,c1,c2){
  const key=icon+c1+c2;if(iconCache[key])return iconCache[key];
  const t=mkCanvas(16,16),tx=t.getContext('2d');
  (ICON[icon]||ICON.heart)(tx,c1,c2);
  const c=mkCanvas(18,18),x=c.getContext('2d');
  x.globalCompositeOperation='source-over';
  for(const[dx,dy]of[[0,1],[2,1],[1,0],[1,2]])x.drawImage(t,dx,dy);
  x.globalCompositeOperation='source-in';x.fillStyle='#050208';x.fillRect(0,0,18,18);
  x.globalCompositeOperation='source-over';x.drawImage(t,1,1);
  return iconCache[key]=c;
}
const itemIcon=it=>iconCanvas(it.icon,it.c1,it.c2);

const DIRS={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]},OPP={u:'d',d:'u',l:'r',r:'l'};
function genFloor(rng,depth){
  const GW=9,GH=8,S=4+3*GW;
  const nb=i=>{const x=i%GW,y=(i/GW)|0,o=[];if(y>0)o.push(['u',i-GW]);if(y<GH-1)o.push(['d',i+GW]);if(x>0)o.push(['l',i-1]);if(x<GW-1)o.push(['r',i+1]);return o};
  for(let attempt=0;attempt<400;attempt++){
    const occ=new Uint8Array(GW*GH),list=[S],q=[S];occ[S]=1;
    const target=depth===7?6:Math.min(18,6+Math.round(depth*1.6)+rng.int(0,2));
    const cnt=i=>nb(i).reduce((a,[,j])=>a+occ[j],0);
    while(q.length&&list.length<target){
      const c=q.shift();
      for(const[,n]of rng.shuffle(nb(c))){
        if(list.length>=target)break;
        if(occ[n]||cnt(n)>1)continue;
        if((c!==S||depth===7)&&rng.chance(.5))continue;
        occ[n]=1;list.push(n);q.push(n);
      }
      if(!q.length&&list.length<target)q.push(rng.pick(list));
    }
    if(list.length<target)continue;
    const ends=list.filter(i=>i!==S&&cnt(i)===1);
    if(ends.length<(depth===7?1:3))continue;
    const dist=new Int16Array(GW*GH).fill(-1);dist[S]=0;const bq=[S];
    while(bq.length){const c=bq.shift();for(const[,n]of nb(c))if(occ[n]&&dist[n]<0){dist[n]=dist[c]+1;bq.push(n)}}
    ends.sort((a,b)=>dist[b]-dist[a]);
    if(dist[ends[0]]<(depth===7?3:2))continue;
    const rooms=new Map();
    for(const i of list)rooms.set(i,{idx:i,gx:i%GW,gy:(i/GW)|0,type:'normal',doors:{},visited:false,seen:false,cleared:false,built:false,dist:dist[i]});
    rooms.get(S).type='start';rooms.get(ends[0]).type='boss';
    const rest=rng.shuffle(ends.slice(1));
    if(depth<7){
      if(rest.length)rooms.get(rest.shift()).type='treasure';
      if(rest.length)rooms.get(rest.shift()).type='shop';
      for(const i of rest){const r=rooms.get(i);if(depth>=2&&rng.chance(.45))r.type='confess';else if(rng.chance(.35))r.type='music'}
    }
    for(const r of rooms.values())for(const[d,n]of nb(r.idx))if(occ[n]&&!r.doors[d]){const o=rooms.get(n),link={secret:false,revealed:true};r.doors[d]={to:o,link};o.doors[OPP[d]]={to:r,link}}
    // secret room: an empty cell touching several rooms, never the boss
    if(depth<7){
      let best=null,bc=1;
      for(let i=0;i<GW*GH;i++){
        if(occ[i])continue;const ns=nb(i).filter(([,j])=>occ[j]);
        if(ns.some(([,j])=>rooms.get(j).type==='boss'))continue;
        const c=ns.length+rng.next()*.5;if(ns.length>=2&&c>bc){bc=c;best=i}
      }
      if(best!=null){
        const sr={idx:best,gx:best%GW,gy:(best/GW)|0,type:'secret',doors:{},visited:false,seen:false,cleared:false,built:false,dist:99};
        rooms.set(best,sr);
        for(const[d,n]of nb(best))if(occ[n]){const o=rooms.get(n),link={secret:true,revealed:false};sr.doors[d]={to:o,link};o.doors[OPP[d]]={to:sr,link}}
      }
    }
    return{depth,rooms,start:rooms.get(S),GW,GH};
  }
  throw new Error('floor gen failed');
}
function tileIdx(cx,cy){return cy*RC+cx}
function cellOf(x,y){return[Math.floor((x-OX)/CELL),Math.floor((y-OY)/CELL)]}
function tileAtCell(cx,cy){if(cx<0||cy<0||cx>=RC||cy>=RR)return -1;return G.room.tiles[cy*RC+cx]}
function cellCenter(cx,cy){return{x:OX+cx*CELL+CELL/2,y:OY+cy*CELL+CELL/2}}
function applyLayout(room,rng,depth){
  const t=room.tiles;let lay;
  if(rng.chance(.35)){lay=symLayout(rng,depth)}
  else{
    const s=rng.pick(LAYOUTS).split('\n').map(r=>r.trim());
    const fx=rng.chance(.5),fy=rng.chance(.5);
    lay=[];for(let y=0;y<RR;y++){let row='';for(let x=0;x<RC;x++){const sy=fy?RR-1-y:y,sx=fx?RC-1-x:x;row+=(s[sy]||'')[sx]||'.'}lay.push(row)}
  }
  for(let y=0;y<RR;y++)for(let x=0;x<RC;x++){
    let c=lay[y][x],v=T_FLOOR;
    if(c==='?')c=rng.chance(.6)?'#':(rng.chance(.5)?'o':'.');
    if(c==='#')v=T_ROCK;else if(c==='o')v=T_POT;else if(c==='~')v=T_PIT;else if(c==='^')v=T_SPIKE;else if(c==='X')v=T_BLOCK;else if(c==='f')v=T_FIRE;
    if(v===T_ROCK&&depth===6&&rng.chance(.25))v=T_FIRE;
    if(v===T_ROCK&&depth===5&&rng.chance(.2))v=T_PIT;
    if(v===T_FIRE&&depth<3)v=T_POT;
    t[tileIdx(x,y)]=v;
  }
  // keep door lanes clear
  for(const[x,y]of[[8,0],[8,RR-1],[0,4],[RC-1,4],[8,1],[8,RR-2],[1,4],[RC-2,4]])t[tileIdx(x,y)]=T_FLOOR;
  if(!connected(room)){for(let x=0;x<RC;x++)if(SOLID_W[t[tileIdx(x,4)]])t[tileIdx(x,4)]=T_FLOOR;for(let y=0;y<RR;y++)if(SOLID_W[t[tileIdx(8,y)]])t[tileIdx(8,y)]=T_FLOOR}
}
function symLayout(rng,depth){
  const g=Array.from({length:RR},()=>Array(RC).fill('.'));
  const kinds=depth===5?['~','~','#','o']:depth===6?['#','f','#','o']:depth===4?['#','^','X','o']:depth===3?['#','o','f','#']:['#','#','o','X'];
  const n=rng.int(2,5);
  for(let i=0;i<n;i++){
    const k=rng.pick(kinds),w=rng.int(1,3),h=rng.int(1,2),x0=rng.int(1,6),y0=rng.int(1,3);
    for(let y=y0;y<Math.min(4,y0+h);y++)for(let x=x0;x<Math.min(8,x0+w);x++){g[y][x]=k;g[y][RC-1-x]=k;g[RR-1-y][x]=k;g[RR-1-y][RC-1-x]=k}
  }
  return g.map(r=>r.join(''));
}
function walkable(t){return!SOLID_W[t]}
function connected(room){
  const t=room.tiles,seen=new Uint8Array(RC*RR),q=[tileIdx(8,4)];
  if(!walkable(t[q[0]]))return false;
  seen[q[0]]=1;let n=0;
  while(q.length){const i=q.pop();n++;const x=i%RC,y=(i/RC)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=RC||ny>=RR)continue;const j=tileIdx(nx,ny);if(!seen[j]&&walkable(t[j])){seen[j]=1;q.push(j)}}}
  for(const[x,y]of[[8,0],[8,RR-1],[0,4],[RC-1,4]])if(!seen[tileIdx(x,y)])return false;
  room.reach=seen;return true;
}
function buildRoom(room){
  const run=G.run,depth=run.depth,fl=FLOORS[depth-1];
  const rng=new RNG(hashStr(run.seedStr+':'+depth+':'+room.idx));
  room.tiles=new Uint8Array(RC*RR);room.tileHp={};room.pickups=[];room.peds=[];room.objects=[];room.spec=[];room.lights=[];
  if(room.type.startsWith('tut'))buildTutRoom(room);
  else if(room.type==='normal'){
    applyLayout(room,rng,depth);
    if(rng.chance(.08)){for(let i=0;i<rng.int(2,4);i++)room.pickups.push(mkPickup(rollDrop(rng,true),CX+rng.range(-80,80),CY+rng.range(-40,40)))}
    else{
      const n=clamp(2+Math.floor(depth*.6)+rng.int(0,2)+(run.hard?1:0),2,8);
      for(let i=0;i<n;i++){
        const type=rng.pick(fl.pool);
        room.spec.push({type,elite:rng.chance(.065+depth*.005)});
        if(type==='choir')i+=2;
      }
      if(rng.chance(.07))room.spec.push({type:'gremlin'});
      room.outage=rng.chance(.1);
    }
    if(rng.chance(.08)){const k=rng.chance(.5)?'jukebox':'photobooth',cx=rng.pick([1,15]),cy=rng.pick([1,7]);room.tiles[tileIdx(cx,cy)]=T_FLOOR;const c=cellCenter(cx,cy);room.objects.push({kind:k,x:c.x,y:c.y})}
  }else if(room.type==='treasure'){
    if(rng.chance(.5))for(const[x,y]of[[2,2],[14,2],[2,6],[14,6]])room.tiles[tileIdx(x,y)]=T_ROCK;
    const it=drawItem('t');if(it)room.peds.push({x:CX,y:CY,item:it});
  }else if(room.type==='shop'){
    const it=drawItem('s');const disc=G.player.flags.discount?.75:1;
    if(it)room.peds.push({x:CX-60,y:CY+10,item:it,price:Math.round(15*disc),pt:'pins'});
    const kinds=['heart','candle',rng.pick(['candy','card','black'])];
    kinds.forEach((k,i)=>room.pickups.push(mkPickup(k,CX+i*40-10,CY+10,{price:Math.round({heart:3,candle:5,candy:4,card:4,black:6}[k]*disc),fixed:true})));
    room.objects.push({kind:'keeper',x:CX,y:OY+26},{kind:'jukebox',x:OX+30,y:OY+30});
  }else if(room.type==='confess'){
    for(let i=0;i<2;i++){const it=drawItem('c');if(it)room.peds.push({x:CX+(i?50:-50),y:CY,item:it,price:it.q>=3?2:1,pt:'hearts'})}
    room.objects.push({kind:'booth',x:CX,y:OY+26});
  }else if(room.type==='music'){
    room.objects.push({kind:'musicbox',x:CX,y:CY,used:false});
  }else if(room.type==='secret'){
    if(rng.chance(.35)){const it=drawItem('t');if(it)room.peds.push({x:CX,y:CY,item:it})}
    else for(let i=0;i<rng.int(3,5);i++)room.pickups.push(mkPickup(rollDrop(rng,true),CX+rng.range(-60,60),CY+rng.range(-30,30)));
  }else if(room.type==='boss'){
    if(depth!==7&&rng.chance(.5))for(const[x,y]of[[3,2],[13,2],[3,6],[13,6]])room.tiles[tileIdx(x,y)]=T_ROCK;
  }
  connected(room);
  room.bg=buildBG(room,fl,rng);
  room.built=true;
}
function drawItem(k){
  const run=G.run;const order=[k,'t','b','s','c'];
  for(const key of order){const arr=run.pools[key];while(arr.length){const id=arr.pop();if(!run.taken[id]){run.taken[id]=1;Save.d.seenI[id]=1;return ITEM[id]}}}
  return null;
}
function rollDrop(rng,generous){
  const r=rng.next()-(G.player?G.player.luck*.01:0);
  if(r<.24)return'heart';if(r<.55)return rng.chance(.12)?'pin5':'pin';if(r<.68)return'candle';
  if(r<.74)return'black';if(r<.77)return'cracked';if(r<.84)return'candy';if(r<.9)return'card';
  return generous?'pin':null;
}

function makePlayer(ch){
  const p={x:CX,y:CY,vx:0,vy:0,r:5,ch,face:'down',flip:false,cool:0,inv:0,
    maxRed:ch.hearts*2,red:ch.hearts*2,extras:[],pins:ch.pins,candles:ch.candles,consum:null,active:null,charge:0,
    items:[],bonus:{dmg:0,rate:0,range:0,spd:0,luck:0},mood:{dmg:0,rate:0,spd:0,range:0},flags:{},trans:{},revives:0,fams:[],
    tearN:0,tmpDmg:1,tmpT:0,tmpFlight:0,lighterT:0,holdItem:null,holdT:0,walkT:0,dead:false,
    dashCd:0,dashT:0,dashes:0,hype:0,hypeT:0,encore:0,lz:0,plug:false,aimX:0,aimY:1,firing:false,weapon:null,noRed:ch.id==='juniper',twin:ch.twins?{x:CX,y:CY,r:5,isTwin:true}:null,invisible:!!ch.invisible,scene:false,fx:0,fy:0};
  for(let i=0;i<ch.black;i++)addExtra(p,'black',2);

}
function recalc(p){
  const ch=p.ch;let dmg=ch.dmg,rate=ch.rate,range=TUNE.range,spd=TUNE.moveSpeed+(ch.spd||0),ss=TUNE.tearSpeed,luck=0,size=0,multi=1,light=0,dmgMul=1,rateMul=1;
  const fl={};let style='tear';
  for(const it of p.items){
    const s=it.st||{};dmg+=s.dmg||0;rate+=s.rate||0;range+=s.range||0;spd+=s.spd||0;ss+=s.ss||0;luck+=s.luck||0;size+=s.size||0;multi+=s.multi||0;light+=s.light||0;
    if(s.dmgMul)dmgMul*=s.dmgMul;if(s.rateMul)rateMul*=s.rateMul;if(it.fl)Object.assign(fl,it.fl);if(it.tear)style=it.tear;if(it.weapon)p.weapon=it.weapon;
  }
  const b=p.bonus,m=p.mood;
  dmg+=b.dmg+m.dmg;rate+=b.rate+m.rate;range+=b.range+m.range;spd+=b.spd+m.spd;luck+=b.luck;
  if(p.trans.scene){spd+=.15;rate+=.3}
  if(p.trans.deathcore){dmg+=1;fl.explode=1}
  if(p.trans.moth)fl.flight=1;
  if(p.trans.ghost)fl.spectral=1;
  p.dmg=Math.max(.5,dmg*dmgMul);p.rate=clamp(rate*rateMul,.7,12);p.fireDelay=60/p.rate;p.range=clamp(range,60,420);
  p.spd=clamp(spd,.9,2.7);p.ss=clamp(ss,1.6,7);p.luck=luck;p.size=Math.max(0,size);p.multi=Math.min(4,multi);p.light=light;p.flags=fl;
  p.style=p.trans.scene?'rainbow':style;p.scene=!!p.trans.scene;
}
const isFlying=p=>!!(p.flags.flight||p.tmpFlight>0);
function extraHalves(p){return p.extras.reduce((a,e)=>a+e.hp,0)}
function heartSlots(p){return p.maxRed/2+p.extras.length}
function addExtra(p,t,h){
  if(t==='black'){

    if(t===T_SPIKE&&!p.flags.spikeImmune&&!(p.dashT>0))damagePlayer(dmgUnit(),'the spikes');

function spawnEnemy(type,x,y,o){

    spawnT:40,fly:!!def.fly,elite:false,dead:false,inv:false,hidden:false,seed:FX.next(),boss:!!def.boss};
  Object.assign(e,o);e.maxhp=e.hp;

function updateEnemies(){
  const p=G.player,slow=G.slowT>0;
  for(const e of G.enemies){
    if(e.dead)continue;
    if(e.spawnT>0){e.spawnT--;continue}
    if(e.flash>0)e.flash--;
    if(e.stun>0)e.stun--;
    if(e.fear>0)e.fear--;
    if(slow&&(G.t&1))continue;
    if(e.slow>0){e.slow--;if(G.t%3===0)continue}
    e.t++;
    if(e.burn>0){e.burn--;if(e.burn%15===0){hurtEnemy(e,1+p.dmg*.25,null);burst(e.x,e.y-4,3,'#ff6a2a',1)}if(e.dead)continue}
    if(e.poison>0){e.poison--;if(e.poison%20===0)hurtEnemy(e,.8+p.dmg*.2,null);if(e.dead)continue}
    e.def.update(e);
    if(Math.abs(e.kx)+Math.abs(e.ky)>.05){moveEnemy(e,e.kx,e.ky);e.kx*=.78;e.ky*=.78}else{e.kx=0;e.ky=0}
    if(!e.hidden&&!e.harmless&&!p.dead){
      const rr=e.r+p.r-2;
      if(d2(e.x,e.y,p.x,p.y)<rr*rr)damagePlayer(dmgUnit(),e.def.name);
      else if(p.twin&&d2(e.x,e.y,p.twin.x,p.twin.y)<rr*rr)damagePlayer(dmgUnit(),e.def.name);
    }
  }
  if(G.enemies.some(e=>e.dead))G.enemies=G.enemies.filter(e=>!e.dead);
}
function onMusicEvent(ev){
  if(G.state!=='play')return;
  for(const e of G.enemies)if(!e.dead&&e.spawnT<=0&&e.def.onEvent)e.def.onEvent(e,ev);
  const p=G.player;
  if(ev==='bar'&&p.flags.sadsong&&G.locked){G.sadBar=(G.sadBar||0)+1;if(G.sadBar%2===0)for(let i=0;i<6;i++)spawnTear(p.x,p.y,i/6*TAU,p,{fl:Object.assign({},p.flags,{homing:1}),dmgMul:.8})}
  if(ev==='drop')addShake(.35);
}

function initWeather(){
  const w=G.floorDef.weather,n={dust:40,rain:130,petals:26,static:0,bubbles:30,ash:70,snowash:50}[w]||0;
  G.weather=[];for(let i=0;i<n;i++)G.weather.push({x:FX.range(0,W),y:FX.range(0,H),v:FX.range(.4,1),a:FX.range(0,TAU)});
}
function updateWeather(kind){
  kind=kind||G.floorDef.weather;
  for(const d of G.weather){
    if(kind==='rain'){d.x-=1.2*d.v;d.y+=6*d.v}
    else if(kind==='dust'){d.x+=Math.sin(G.t*.01+d.a)*.15;d.y+=Math.cos(G.t*.013+d.a)*.12}
    else if(kind==='petals'){d.x+=Math.sin(G.t*.02+d.a)*.4;d.y+=.35*d.v;d.a+=.03}
    else if(kind==='bubbles'){d.y-=.5*d.v;d.x+=Math.sin(G.t*.05+d.a)*.2}
    else if(kind==='ash'){d.x+=.3+Math.sin(G.t*.02+d.a)*.3;d.y+=.4*d.v}
    else if(kind==='snowash'){d.y+=.25*d.v;d.x+=Math.sin(G.t*.01+d.a)*.2}
    if(d.y>H)d.y-=H;if(d.y<0)d.y+=H;if(d.x<0)d.x+=W;if(d.x>W)d.x-=W;
  }
}
function drawWeather(c,kind){
  kind=kind||G.floorDef.weather;
  if(kind==='rain'){c.strokeStyle='rgba(170,190,230,.28)';c.lineWidth=1;c.beginPath();for(const d of G.weather){c.moveTo(d.x,d.y);c.lineTo(d.x-1.5*d.v,d.y+7*d.v)}c.stroke()}
  else if(kind==='dust'){c.fillStyle='rgba(255,230,240,.18)';for(const d of G.weather)c.fillRect(d.x,d.y,1,1)}
  else if(kind==='petals'){c.fillStyle='rgba(255,143,184,.55)';for(const d of G.weather){c.save();c.translate(d.x,d.y);c.rotate(d.a);c.fillRect(-1.5,-.5,3,1.5);c.restore()}}
  else if(kind==='bubbles'){c.strokeStyle='rgba(160,200,255,.35)';for(const d of G.weather){c.beginPath();c.arc(d.x,d.y,1+d.v*1.5,0,TAU);c.stroke()}}
  else if(kind==='ash'){for(const d of G.weather){c.fillStyle=d.v>.9?'rgba(255,120,50,.7)':'rgba(140,130,130,.45)';c.fillRect(d.x,d.y,1+(d.v>.7?1:0),1)}}
  else if(kind==='snowash'){c.fillStyle='rgba(240,236,244,.4)';for(const d of G.weather)c.fillRect(d.x,d.y,1,1)}

// ---------- hype / encore, dash, weapons, beams ----------
function addHype(p,v){if(p.encore>0)return;p.hype=Math.min(100,(p.hype||0)+v);p.hypeT=150;if(p.hype>=100){p.hype=0;p.encore=480;banner('ENCORE!','The crowd goes wild.',null,'#ffd23f');AU.play('crowd');flashScreen(.2);grantAch('crowd')}}
function fireBeam(p,a){
  const n=p.multi;for(let i=0;i<n;i++){const aa=a+(i-(n-1)/2)*.17;G.beams.push({a:aa,t:16,dmg:shotDamage(p)*1.35*(p.encore>0?1.5:1),twin:false});if(p.twin)G.beams.push({a:Math.PI-aa,t:16,dmg:shotDamage(p)*1.35,twin:true})}
  AU.play('laser');addShake(.25);
}
function beamEnd(x,y,a){let t=0;const dx=Math.cos(a),dy=Math.sin(a);while(t<600){const nx=x+dx*t,ny=y+dy*t;if(nx<OX||nx>OX+IW||ny<OY||ny>OY+IH)break;t+=4}return{x:x+dx*t,y:y+dy*t,len:t}}
function updateBeams(){
  const p=G.player;
  for(let i=G.beams.length-1;i>=0;i--){
    const b=G.beams[i];b.t--;b.x=b.twin?p.twin.x:p.x;b.y=(b.twin?p.twin.y:p.y)-3;
    if(b.t%4===0){const end=beamEnd(b.x,b.y,b.a),dx=Math.cos(b.a),dy=Math.sin(b.a);
      for(const e of G.enemies){if(e.dead||e.spawnT>0)continue;const vx=e.x-b.x,vy=e.y-b.y,pr=vx*dx+vy*dy;if(pr<0||pr>end.len)continue;const perp=Math.abs(vx*dy-vy*dx);if(perp<e.r+6){if(hurtEnemy(e,b.dmg,null)&&!e.boss&&!e.def.heavy){e.kx+=dx*1.5;e.ky+=dy*1.5}}}
      if(b.t%8===0)burst(end.x,end.y,4,'#ff8fc8',1.6)}
    if(b.t<=0)G.beams.splice(i,1);
  }
  for(let i=G.ghosts.length-1;i>=0;i--)if(--G.ghosts[i].t<=0)G.ghosts.splice(i,1);
  for(let i=G.nums.length-1;i>=0;i--){const n=G.nums[i];n.y-=.35;if(--n.t<=0)G.nums.splice(i,1)}
}
function drawBeams(c){
  const p=G.player;
  for(const b of G.beams){const e=beamEnd(b.x,b.y,b.a),w=b.t/16;c.strokeStyle=`rgba(255,79,123,${.5*w})`;c.lineWidth=10*w+2;c.beginPath();c.moveTo(b.x,b.y);c.lineTo(e.x,e.y);c.stroke();c.strokeStyle='#fff0f6';c.lineWidth=3*w+1;c.stroke();c.lineWidth=1}
  if(p.lz>0){const max=Math.max(24,p.fireDelay*2.6),k=p.lz/max;c.strokeStyle=k>=1?(G.t>>2&1?'#fff':'#ff4f7b'):'rgba(255,79,123,.7)';c.beginPath();c.arc(p.x,p.y-3,4+k*10,0,TAU*k);c.stroke()}
  if(Save.d.opts.dmgNums)for(const n of G.nums)txt(c,n.v,n.x,n.y,{align:'center',col:n.crit?'#ff3b30':'#ffffff',alpha:Math.min(1,n.t/15)});
}
function drawGhosts(c){const p=G.player;if(p.invisible)return;const spr=playerSprites(p.ch,p.scene);for(const g of G.ghosts){c.globalAlpha=g.t/24;c.save();c.translate(g.x|0,g.y|0);if(g.face==='side'&&g.flip)c.scale(-1,1);c.drawImage(spr[g.face],-8,-12);c.restore()}c.globalAlpha=1}

function genTutorialFloor(){
  const rooms=new Map(),GW=9,GH=8,types=['tut1','tut2','tut3','tut4'];
  const list=types.map((type,i)=>{const idx=3*GW+2+i;const r={idx,gx:2+i,gy:3,type,doors:{},visited:false,seen:true,mapped:true,cleared:type!=='tut3',built:false,dist:i};rooms.set(idx,r);return r});
  for(let i=0;i<3;i++){const link={secret:false,revealed:true};list[i].doors.r={to:list[i+1],link};list[i+1].doors.l={to:list[i],link}}
  return{depth:1,rooms,start:list[0],GW,GH,tutorial:true};
}
function buildTutRoom(room){
  const t=room.tiles;
  if(room.type==='tut2'){
    for(let y=0;y<RR;y++)t[tileIdx(15,y)]=T_ROCK;
    room.peds.push({x:CX-60,y:CY,item:ITEM.rose});
    for(let i=0;i<3;i++)room.pickups.push(mkPickup('pin',CX+i*14,CY+40));
    room.pickups.push(mkPickup('candle',CX+60,CY+40));
  }
  if(room.type==='tut3')room.spec=[{type:'moth'},{type:'moth'},{type:'moth'}];
  if(room.type==='tut4')for(let y=0;y<RR;y++)for(const x of[8,9])t[tileIdx(x,y)]=T_SPIKE;
}

function optRows(tab){
  const o=Save.d.opts,onoff=v=>v?'ON':'OFF',bar=v=>'■'.repeat(Math.round(v*10))+'□'.repeat(10-Math.round(v*10));
  const tog=(k,after)=>({v:()=>onoff(o[k]),act:()=>{o[k]=!o[k];after&&after()}});

function inRect(p,r){return p.x>=r[0]&&p.x<=r[0]+r[2]&&p.y>=r[1]&&p.y<=r[1]+r[3]}
let lastPtr={x:-1,y:-1};
function menuNav(n){
  const m=G.menu;
  if(Input.pressed('mu')){m.sel=(m.sel+n-1)%n;AU.play('blip')}
  if(Input.pressed('md')){m.sel=(m.sel+1)%n;AU.play('blip')}
  const moved=Input.ptr.x!==lastPtr.x||Input.ptr.y!==lastPtr.y;lastPtr={x:Input.ptr.x,y:Input.ptr.y};
  if(m.rects){
    if(moved&&Input.ptr.mouse)m.rects.forEach((r,i)=>{if(r&&inRect(Input.ptr,r)&&m.sel!==i){m.sel=i;AU.play('blip')}});
    for(const cl of Input.clicks)for(let i=0;i<m.rects.length;i++)if(m.rects[i]&&inRect(cl,m.rects[i])){m.sel=i;return i}
  }
  if(Input.pressed('ok'))return m.sel;
  return -1;
}

function drawRainBg(c,tint){

function resume(){G.state=G.prevState==='bossintro'?'bossintro':'play';G.prevState=null;AU.setMuffle(G.floorDef.water?2400:18000);G.lowHP=null}
function renderPause(c){
  c.fillStyle='rgba(5,2,8,.82)';c.fillRect(0,0,W,H);
  txt(c,'Paused',90,30,{align:'center',font:F_T,size:26});
  drawMenu(c,['RESUME','SETTINGS','QUIT RUN'],90,80,16);
  txt(c,'CONTROLS',20,150,{col:'#a89cb8'});[['move','move'],['cry','shoot'],['dash','dash'],['candle','bomb'],['item','active'],['use','use'],['map','map'],['pause','pause']].forEach(([l,a],k)=>{txt(c,l,20,162+k*9,{size:8,col:'#6a607a'});txt(c,glyph(a),84,162+k*9,{size:8,col:'#d8cce4'})});
  const p=G.player,r=G.run;
  txt(c,tr('FLOOR')+' '+G.floorDef.ro+' · '+tr(G.floorDef.n),190,22,{col:G.floorDef.acc});
  txt(c,tr('SEED')+' '+r.seedStr+(r.daily?' ('+tr('DAILY')+')':'')+(r.hard?' · '+tr('HEAVIER'):''),190,34,{col:'#6a607a'});
  const st=[['WEAPON',p.weapon?tr(ITEMS.find(i=>i.weapon===p.weapon).n):tr('tears')],['DAMAGE',p.dmg.toFixed(2)],['TEARS/S',p.rate.toFixed(2)],['RANGE',p.range|0],['SPEED',p.spd.toFixed(2)],['SHOT SPEED',p.ss.toFixed(2)],['LUCK',p.luck|0]];
  st.forEach(([k,v],i)=>{txt(c,k,190,48+i*10,{col:'#a89cb8'});txt(c,String(v),300,48+i*10,{col:'#fff'})});
  txt(c,'ITEMS',190,124,{col:'#a89cb8'});
  r.items.forEach((it,i)=>c.drawImage(itemIcon(it),190+(i%14)*19,136+((i/14)|0)*19));
  const trs=Object.keys(p.trans);if(trs.length)txt(c,trs.map(t=>SETS[t].n).join(' · '),190,H-20,{col:'#ff8fc8'});
  const hov=r.items.findIndex((it,i)=>inRect(Input.ptr,[190+(i%14)*19,136+((i/14)|0)*19,18,18]));
  if(hov>=0){const it=r.items[hov];c.fillStyle='rgba(0,0,0,.85)';c.fillRect(20,H-60,160,48);txt(c,it.n,26,H-56,{col:'#fff'});wrapText(c,it.f,150,12).forEach((l,j)=>txt(c,l,26,H-44+j*10,{font:F_X,size:12,col:'#b8aec8'}))}
}
function updBossIntro(){
  updateTrans();updateParticles();
  G.introT++;
  if(G.introT>170||(G.introT>45&&(Input.pressed('ok')||Input.clicks.length))){G.state='play';G.introT=0}
}
function renderBossIntro(c){
  const b=G.boss;if(!b)return;const t=G.introT,k=Math.min(1,t/60);
  c.fillStyle=`rgba(0,0,0,${.6*Math.min(1,t/20)})`;c.fillRect(0,80,W,90);
  c.fillStyle='#7a0a1f';c.fillRect(0,80,W*Math.min(1,t/25),1);c.fillRect(W-W*Math.min(1,t/25),169,W,1);
  txt(c,b.def.ro,CX,90,{align:'center',font:F_T,size:16,col:'#c21e3a',alpha:Math.min(1,t/30)});
  c.save();c.font='34px '+F_T;const w=c.measureText(tr(b.def.name)).width;c.beginPath();c.rect(CX-w/2-4,100,(w+8)*k,48);c.clip();
  txt(c,b.def.name,CX,108,{align:'center',font:F_T,size:34,col:'#efe6f4',shadow:'#5a0a1a'});c.restore();
  for(let i=0;i<10;i++){const x=CX-w/2+((i*53)%Math.max(1,w)),l=Math.max(0,t-30-i*4)*.4;if(x<CX-w/2+(w+8)*k){c.fillStyle='rgba(122,10,31,.8)';c.fillRect(x,140,1.5,Math.min(20,l))}}
}
function toSummary(){
  const r=G.run,p=G.player,won=!!r.win;
  const mins=r.frames/3600;
  r.score=Math.max(0,Math.round(r.depth*1000+r.kills*10+r.items.length*25+r.bossKills*500+(won?5000:0)-mins*20));
  if(r.score>Save.d.best)Save.d.best=r.score;
  if(r.daily){Save.d.daily[dateKey()]={done:true,score:r.score}}
  Save.write();
  G.state='summary';G.sumT=0;Music.setMode('void');AU.setMuffle(18000);
}
const CLOSERS=["The rain didn't stop.",'Nobody called.','The candle burned all the way down.','It was a quiet night.','The song ended mid-chorus.','Someone left the light on.'];
function epitaph(r){
  const pas=r.items.filter(i=>!i.active),nm=tr(r.char.name);
  let s=pas.length>=2?tr('{0} carried {1} and {2}.',nm,tr(pas[pas.length-1].n),tr(pas[0].n)):pas.length?tr('{0} carried {1}.',nm,tr(pas[0].n)):tr('{0} carried nothing at all.',nm);
  return s+' '+(r.win?tr('They made it out.'):tr('They made it to {0}.',tr(FLOORS[r.depth-1].n)))+' '+tr(CLOSERS[r.seed%CLOSERS.length]);
}
function updSummary(){G.sumT++;if(G.sumT>60&&(Input.pressed('ok')||Input.pressed('back')||Input.clicks.length))goTitle()}
function renderSummary(c){
  const r=G.run,won=!!r.win;
  drawRainBg(c,won?'#120c1a':'#0a0508');
  const t=G.sumT;
  txt(c,won?'The End':(r.killer==='going home early'?'Gone Home':'You Died'),CX,16,{align:'center',font:F_T,size:36,col:won?'#efe6f4':'#c21e3a',alpha:Math.min(1,t/30)});
  const epl=wrapText(c,epitaph(r),400,14);epl.forEach((l,i)=>txt(c,l,CX,58+i*13,{align:'center',font:F_X,size:14,col:'#d8cce4',alpha:Math.min(1,Math.max(0,(t-20)/30))}));
  const y0=Math.max(104,64+epl.length*13);
  const lines=[['FLOOR',FLOORS[r.depth-1].ro+' · '+tr(FLOORS[r.depth-1].n)],['KILLED BY',tr(won?'nothing, in the end':r.killer||'something')],['TIME',`${Math.floor(r.frames/3600)}:${String(Math.floor(r.frames/60)%60).padStart(2,'0')}`],['KILLS',r.kills],['SCORE',r.score+(r.score>=Save.d.best?'  '+tr('(best)'):'')],['SEED',r.seedStr+(r.daily?' '+tr('daily'):'')]];
  lines.forEach(([k,v],i)=>{txt(c,k,CX-120,y0+i*11,{col:'#8f86a0',alpha:Math.min(1,Math.max(0,(t-40)/20))});txt(c,String(v),CX-30,y0+i*11,{col:'#fff',alpha:Math.min(1,Math.max(0,(t-40)/20))})});
  r.items.forEach((it,i)=>{if(t>60+i*3)c.drawImage(itemIcon(it),CX-r.items.length*9.5+i*19,176)});
  if(r.newUnlocks.length){txt(c,'UNLOCKED',CX,200,{align:'center',col:'#ffd23f'});wrapText(c,r.newUnlocks.map(a=>tr(a.name)).join(' · '),420,12).slice(0,3).forEach((l,i)=>txt(c,l,CX,211+i*11,{align:'center',font:F_X,size:12,col:'#ffe9a0'}))}
  if(t>60&&(t>>5&1))txt(c,tr('PRESS {0}',glyph('ok')),CX,H-20,{align:'center',col:'#ff8fc8'});
}
const END_TEXT={kill:['You won.',"It didn't feel like winning.",'The room went quiet.','You walked home in the rain.'],hug:['You stopped.','It stopped too.','You sat with it until morning.','It was still there. That was okay.']};
function updEnding(){G.endT++;updateParticles();const n=END_TEXT[G.run.win].length;if(G.endT>n*140+140||(G.endT>90&&Input.pressed('ok')))toSummary()}
function renderEnding(c){
  const hug=G.run.win==='hug',t=G.endT;
  c.fillStyle=hug?'#e8e2ec':'#030104';c.fillRect(0,0,W,H);
  END_TEXT[G.run.win].forEach((l,i)=>{const a=clamp((t-i*140)/60,0,1);txt(c,l,CX,80+i*28,{align:'center',font:F_T,size:20,col:hug?'#2a1a2e':'#e9e1f0',alpha:a,shadow:false})});
  if(hug){const s=playerSprites(G.player.ch.invisible?CHARS[0]:G.player.ch).down;c.save();c.translate(CX,220);c.scale(2,2);c.drawImage(s,-14,-12);c.globalAlpha=.6;c.drawImage(s,-2,-12);c.restore()}
}
function updDying(){G.dieT++;updateParticles();const p=G.player;if(G.dieT===10)burst(p.x,p.y,40,'#cfe6ff',2.5);if(G.dieT>140)toSummary()}

// ---------- 14. MAIN LOOP ----------
function updateTrans(){
  const trn=G.trans;if(!trn)return false;trn.t++;
  if(trn.type==='slide'){if(trn.t>=trn.dur)G.trans=null;return true}
  if(trn.type==='fade'){if(trn.mid&&trn.t>=trn.dur/2){const m=trn.mid;trn.mid=null;m()}if(trn.t>=trn.dur)G.trans=trn.after||null;return true}
  if(trn.type==='floor'&&trn.t>=trn.dur)G.trans=null;
  return false;
}
function updPlay(){
  const p=G.player;
  if(Input.pressed('pause')){G.prevState='play';G.state='pause';G.menu={sel:0};AU.setMuffle(900);return}
  if(updateTrans()){updateParticles();return}
  if(G.hitstop>0){G.hitstop--;updateParticles();return}
  G.t++;G.roomT++;G.run.frames++;
  if(G.slowT>0)G.slowT--;
  if(G.swing>0)G.swing--;
  if(--G.flowT<=0){computeFlow();G.flowT=8}
  updatePlayer(p);if(G.state!=='play'||G.trans&&G.trans.type!=='floor')return;
  updateFams(p);updateTears();updateEnemies();updateEBul();updateCreeps();updateBombs();updatePickups();updateBeams();updateTutorial();
  const cur=G.fx;G.fx=[];const due=[];for(const f of cur){if(--f.t<=0)due.push(f);else G.fx.push(f)}for(const f of due)f.f();
  for(let i=G.zaps.length-1;i>=0;i--)if(--G.zaps[i].t<=0)G.zaps.splice(i,1);
  for(let i=G.tmpLights.length-1;i>=0;i--)if(--G.tmpLights[i].t<=0)G.tmpLights.splice(i,1);
  checkClear();
  const low=p.red+extraHalves(p)<=2&&!p.dead;
  if(low!==G.lowHP){G.lowHP=low;AU.setMuffle(low?1200:(G.floorDef.water?2400:18000))}
  if(low&&G.t%55===0)AU.play('heartbeat');
  updateParticles();updateWeather();
}
function step(){
  Input.update();
  if(G.skipInput){G.skipInput=false;Input.endStep();return}
  if(Input.pressed('mute')){AU.muted=!AU.muted;AU.applyVolume();if(G.run)toast(AU.muted?'Muted':'Sound on','','#fff')}
  if(Input.pressed('full'))toggleFull();
  Music.tick();Music.poll(onMusicEvent);
  G.frame++;
  G.shake=Math.max(0,G.shake-.035);G.flash=Math.max(0,G.flash-.05);G.chroma=Math.max(0,G.chroma-.06);
  switch(G.state){
    case'title':updTitle();break;
    case'select':updSelect();break;
    case'journal':updJournal();break;
    case'options':updOptions();break;
    case'play':updPlay();break;
    case'pause':updPause();break;
    case'bossintro':updBossIntro();break;
    case'dying':updDying();break;
    case'summary':updSummary();break;
    case'ending':updEnding();break;
  }
  Input.endStep();
}
function render(){
  const s=G.state;
  B.setTransform(1,0,0,1,0,0);B.globalAlpha=1;B.globalCompositeOperation='source-over';
  if(s==='boot'||s==='title')renderTitle(B);
  else if(s==='select')renderSelect(B);
  else if(s==='journal')renderJournal(B);
  else if(s==='summary')renderSummary(B);
  else if(s==='ending')renderEnding(B);
  else if(s==='options'&&G.optBack!=='pause')renderOptions(B);
  else if(G.run&&G.room){
    renderGame(B);
    if(s==='bossintro')renderBossIntro(B);
    if(s==='pause')renderPause(B);
    if(s==='options')renderOptions(B);
    if(s==='dying'){B.fillStyle=`rgba(0,0,0,${Math.min(.7,G.dieT/120)})`;B.fillRect(0,0,W,H);if(G.dieT>40)txt(B,'...',CX,CY,{align:'center',font:F_T,size:24,alpha:Math.min(1,(G.dieT-40)/40)})}
  }
  const v=View,x=v.ctx;
  x.fillStyle='#000';x.fillRect(0,0,v.cv.width,v.cv.height);
  x.imageSmoothingEnabled=false;
  x.drawImage(buf,v.ox,v.oy,W*v.scale,H*v.scale);
  if(G.chroma>0&&Save.d.opts.flash){const o=Math.max(1,Math.round(v.scale*1.5*G.chroma));x.globalCompositeOperation='lighter';x.globalAlpha=.18*G.chroma;x.drawImage(buf,v.ox+o,v.oy,W*v.scale,H*v.scale);x.drawImage(buf,v.ox-o,v.oy,W*v.scale,H*v.scale);x.globalAlpha=1;x.globalCompositeOperation='source-over'}
}
let accT=0,lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  if(!lastT)lastT=now;
  let dt=(now-lastT)/1000;lastT=now;if(dt>0)G.fps=Math.round(lerp(G.fps,1/dt,.05));if(dt>.25)dt=.25;accT+=dt;
  let n=0;while(accT>=1/60&&n<5){try{step()}catch(e){console.error(e);G.err=e}accT-=1/60;n++}
  if(n>=5)accT=0;
  try{render()}catch(e){console.error(e);G.err=e}
}
function boot(){
  Save.load();applyBinds();View.init();Input.init(View.cv);applyVideo();
  G.state='boot';
  try{document.fonts&&document.fonts.load('20px "Pirata One"');document.fonts.load('8px Silkscreen');document.fonts.load('12px VT323')}catch(e){}
  requestAnimationFrame(frame);
}
window.__SB={G,Input,tr,startTutorial,Save,Music,AU,startRun,enterFloor,enterRoom,goTitle,ITEM,giveItem,FLOORS};
boot();
